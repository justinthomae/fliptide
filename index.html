  // ---------- who's online, invites ----------
  function myState(){ const s=S&&S.screen; return s==='wait'?{st:'room',code:NET.code||''}:s==='play'&&S.net?{st:'playing',code:NET.code||''}:s==='play'?{st:'playing',code:''}:{st:'menu',code:''} }
  function joinSocial(){
    if(!user||ch) return;
    ch=sb.channel('gm:social',{config:{broadcast:{self:false,ack:false},presence:{key:user.id}}});
    ch.on('presence',{event:'sync'},()=>{ pres.clear(); const st=ch.presenceState(); for(const k in st){ const p=st[k]&&st[k][0]; if(p&&p.uid) pres.set(p.uid,p) } draw(); badge() });
    ch.on('broadcast',{event:'m'},({payload})=>onMsg(payload||{}));
    ch.subscribe(s=>{ if(s==='SUBSCRIBED'){ lastTrack=''; track() } });
  }
  function track(){
    if(!ch||!user) return; const s=myState(), info={uid:user.id,game:GM.app,name:(prof&&prof.display_name)||nameOf(user.id),st:s.st,code:s.code};
    const k=JSON.stringify(info); if(k===lastTrack) return; lastTrack=k; ch.track(info).catch(()=>{});
  }
  function statusOf(id){
    const p=pres.get(id);
    // online in another Grudge Match game: where they are, but no Join or Invite across games
    if(p&&p.game&&p.game!==GM.app){ const g=gameName(p.game); return p.st==='playing'?{rank:2.6,dot:'play',text:`Playing ${g}`}:p.st==='room'?{rank:2.7,dot:'on',text:`In a ${g} lobby`}:{rank:2.5,dot:'on',text:`Online in ${g}`} }
    if(p) return p.st==='room'?{rank:5,dot:'on',text:'In a Fliptide game lobby',join:!!p.code,ft:true}:p.st==='playing'?{rank:4,dot:'play',text:'Playing Fliptide',ft:true}:{rank:3,dot:'on',text:'Online in Fliptide',ft:true};
    const s=bt.get(id), age=s&&s.last_activity_at?Date.now()-new Date(s.last_activity_at).getTime():Infinity;
    if(age<ONLINE_MS&&s.status!=='Offline') return {rank:2,dot:'other',text:s.status==='In Game'?'Playing BoomTown':'Online in BoomTown'};
    return {rank:0,dot:'off',text:age<Infinity?`Last seen ${ago(age)}`:'Offline'};
  }
  const ago=ms=>{ const m=Math.round(ms/60000); if(m<60) return `${Math.max(1,m)}m ago`; const h=Math.round(m/60); if(h<48) return `${h}h ago`; return `${Math.round(h/24)}d ago` };
  const okCode=c=>/^[a-z0-9]{3,9}$/i.test(String(c||''));
  function send(m){ if(ch) ch.send({type:'broadcast',event:'m',payload:{from:user.id,name:(prof&&prof.display_name)||nameOf(user.id),game:GM.app,...m}}).catch(()=>{}) }
  // ---------- invites ----------
  // Sent through GMInvites (the gm_invites table shared by every Grudge Match game). If that can't be reached, a live
  // message on gm:social reaches friends who are online right now:
  //   invite {t:'invite',v:2,id,to,game,gameName,code,url}; reply {t:'invite-reply',v:2,id,to,game,answer:'now'|'later'|'no'}
  const GM_URL=/^https:\/\/([a-z0-9-]+\.)?grudgematchgames\.com(\/[^\s"'<>]*)?$/i, SEND_AGAIN_MS=30000;
  const inv=new Map();   // friend id -> {iid, code, st:'sent'|'now'|'later'|'no', at}
  let later=null, laterT=null;
  let go=u=>location.assign(u);
  function onMsg(m){
    if(!user||m.to!==user.id||!isFriend(m.from)) return;   // only friends can reach you
    if(m.t==='invite-reply'){ if(m.game===GM.app) onReply(m); return }
    if(m.t==='invite'){ const foreign=(m.game||GM.app)!==GM.app;
      if(foreign?GM_URL.test(String(m.url||'')):okCode(m.code)) showInvite(m); return }
    if((m.game||GM.app)!==GM.app) return;
    if(m.t==='ask'){ const s=myState(); if(s.st==='room'&&s.code) send({t:'code',to:m.from,code:s.code}) }
    else if(m.t==='code'&&okCode(m.code)&&wantCode===m.from){ wantCode=null; clearTimeout(askT); close(); enter(String(m.code)) }
  }
  function joinFriend(id){
    if(myState().st==='playing'){ msg='Finish your game first.'; draw(); return }
    wantCode=id; send({t:'ask',to:id}); msg='Asking for their game…'; draw();
    clearTimeout(askT); askT=setTimeout(()=>{ if(wantCode===id){ wantCode=null; msg='They didn’t answer. They may have just started or left their game.'; draw() } },5000);
  }
  async function invite(id,quiet){
    const s=myState(); if(s.st!=='room'||!s.code) return;
    const url='https://fliptide.grudgematchgames.com/?join='+encodeURIComponent(s.code), iid=Math.random().toString(36).slice(2,10);
    inv.set(id,{iid,code:s.code,st:'sent',at:Date.now()}); if(!quiet) draw();
    const r=window.GMInvites?await GMInvites.send({to:id,toName:nameOf(id),url,code:s.code,mode:'Online game'}):{error:'off'};
    if(r.error){ send({t:'invite',v:2,id:iid,to:id,code:s.code,gameName:'Fliptide',url});
      if(!pres.has(id)&&!quiet) msg=`${nameOf(id)} isn’t online right now, so the invite may not reach them.` }
    if(!quiet){ if(!msg) msg=`Invite sent to ${nameOf(id)}.`; draw() }
  }
  // where an invite stands: the shared table's answer if there is one, else the live message's
  const GI_ST={pending:'sent',now:'now',later:'later',declined:'no',joined:'joined'};
  const invOf=id=>{ const x=inv.get(id), s=myState(); if(!x||x.code!==s.code) return null;
    const g=window.GMInvites&&GMInvites.status(id,s.code); return g&&GI_ST[g]?{...x,st:GI_ST[g]}:x };
  // the host hears back: on the way now, coming after their current game, or not this time
  function onReply(m){
    const x=inv.get(m.from); if(!x||(m.id&&x.iid!==m.id)) return;
    x.st=['now','later','no'].includes(m.answer)?m.answer:x.st; x.at=Date.now();
    const n=esc(nameOf(m.from));
    note(x.st==='now'?`<b>${n}</b> accepted your invite and is on the way.`:x.st==='later'?`<b>${n}</b> accepted your invite. They’ll join as soon as their current game ends.`:`<b>${n}</b> can’t join right now.`,m.from);
    draw();
  }
  function toastEl(id,cls){ let t=document.getElementById(id); if(!t){ t=document.createElement('div'); t.id=id; t.className='gmtoast'+(cls?' '+cls:''); document.body.appendChild(t) } return t }
  function note(html,from){ const t=toastEl('gmNote','top'); t.innerHTML=`${from?picHTML(from):''}<p>${html}</p><button class="btn small ghost" data-x>OK</button>`; t.hidden=false;
    t.querySelector('[data-x]').onclick=()=>{ t.hidden=true }; clearTimeout(note.t); note.t=setTimeout(()=>{ t.hidden=true },9000); try{ sfx('chime') }catch(e){} }
  // join a Fliptide game by code, leaving whatever is on screen (a game in progress stays saved on this device)
  function enter(code){ close(); if(S&&S.screen==='play'){ const u=new URL(location.href); u.search='?join='+encodeURIComponent(code); go(u.href) } else joinByCode(code) }
  function goTo(m){ if((m.game||GM.app)!==GM.app) go(m.url); else enter(String(m.code)) }
  function reply(m,answer){ send({t:'invite-reply',v:2,id:m.id,to:m.from,game:m.game||GM.app,answer}) }
  function showInvite(m){
    const s=myState(), foreign=(m.game||GM.app)!==GM.app;
    if(!foreign&&s.code===String(m.code)) return;
    const busyNow=s.st==='playing', g=foreign?(m.gameName||gameName(m.game)):'Fliptide';
    const t=toastEl('gmToast');
    t.innerHTML=`${picHTML(m.from)}<p><b>${esc(nameOf(m.from)||m.name)}</b> invited you to ${foreign?`play <b>${esc(g)}</b>`:'their Fliptide game'}</p>
      <div class="gmtbtns"><button class="btn small primary" data-a="now">${busyNow?'Accept and join now':'Accept and join'}</button>${busyNow?'<button class="btn small" data-a="later">Join after this game</button>':''}<button class="btn small ghost" data-a="no">Not now</button></div>`;
    t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true },60000); try{ sfx('chime') }catch(e){}
    t.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ t.hidden=true; const a=b.dataset.a; reply(m,a);

    t.hidden=false; t.querySelector('[data-x]').onclick=()=>{ t.hidden=true; reply(m,'no'); later=null };
  }
  function laterCheck(){

    const m=later, t=document.getElementById('gmLater'); let n=4;
    const tick=()=>{ if(!later){ laterT=null; return } if(n<=0){ laterT=null; later=null; if(t) t.hidden=true; goTo(m); return }
      if(t){ t.innerHTML=`${picHTML(m.from)}<p>Joining <b>${esc(nameOf(m.from)||m.name)}</b>’s game in ${n}…</p><button class="btn small ghost" data-x>Stay here</button>`; t.hidden=false;
        t.querySelector('[data-x]').onclick=()=>{ clearTimeout(laterT); laterT=null; t.hidden=true; reply(m,'no'); later=null } }

  }

    return `<div class="gmme"><button class="gmbig" data-gmpick aria-label="Change your Fliptide picture">${picHTML(user.id,'gmavbig')}<span>Change</span></button>
      <div class="gmwho"><label class="label" for="gmMyName">Your Fliptide name</label><input id="gmMyName" maxlength="16" value="${esc((prof&&prof.display_name)||'')}" autocomplete="nickname">
      <small class="muted">${acct&&acct.username?'@'+esc(acct.username)+' · ':''}Grudge Match Games account</small></div></div>
      ${picking?`<div class="gmpicks"><p class="muted st-small">Your Fliptide picture is only used in Fliptide. Your other games keep their own.</p>
        <div class="avgrid">${Object.keys(AVATARS).map(k=>`<button class="avopt${avKey(prof.avatar)===k?' on':''}" data-gmav="${k}" aria-label="${esc(AV_LABELS[k])}"><img src="${avSrc(k)}" alt=""></button>`).join('')}</div>
        <label class="btn small ghost gmup">Upload a photo<input type="file" id="gmFile" accept="image/*" hidden></label></div>`:''}
      <div class="gmstats">${stat(g,g===1?'game':'games')}${stat(st.wins||0,'wins')}${stat(g?Math.round((st.wins||0)/g*100)+'%':'–','win rate')}${stat(st.best||0,'best score')}${stat(g?(st.points/g).toFixed(1):'–','avg score')}${stat(st.schools||0,'schools')}</div>
      <p class="muted st-small">Games count for the seat with your name on this device, or your seat in an online game.</p>
      <button class="btn small ghost" id="gmOut">Sign out</button>`;
  }
  function friendsHTML(){
    const L=lists(), s=myState(), inRoom=s.st==='room'&&!!s.code;
    const row=(id,actions,line)=>`<li class="gmrow">${picHTML(id)}<span class="gmname"><b>${esc(nameOf(id))}</b>${line||''}</span><span class="gmact">${actions}</span></li>`;
    const stLine=x=>`<small><i class="gmst ${x.dot}"></i>${esc(x.text)}</small>`;
    return `<input id="gmSearch" class="gmsearch" placeholder="Add a friend by username" value="${esc(searchQ)}" autocomplete="off" spellcheck="false" enterkeyhint="search">
      ${searchRes?`<ul class="gmlist">${searchRes.length?searchRes.map(p=>{ const rel=relation(p.id);
        const a=rel==='friend'?'<span class="gmtag">Friends</span>':rel==='outgoing'?'<span class="gmtag">Sent</span>':rel==='incoming'?`<button class="btn small primary" data-acc="${esc(p.id)}">Accept</button>`:rel==='blocked'?'':`<button class="btn small primary" data-add="${esc(p.id)}">Add</button>`;
        return row(p.id,a,p.username?`<small>@${esc(p.username)}</small>`:'') }).join(''):'<li class="muted">Nobody by that name yet.</li>'}</ul>`:''}
      ${L.incoming.length?`<span class="label">Friend requests</span><ul class="gmlist">${L.incoming.map(x=>row(x.id,`<button class="btn small primary" data-accrow="${esc(x.r.id)}">Accept</button><button class="btn small ghost" data-drop="${esc(x.id)}">Decline</button>`,'<small>wants to be friends</small>')).join('')}</ul>`:''}
      <span class="label">Friends${L.friends.length?` · ${L.friends.filter(x=>x.s.rank>=2).length} online`:''}</span>
      ${inRoom?'<button class="btn primary" data-gmtab="invite">Invite friends to this game</button>':''}
      <ul class="gmlist">${L.friends.length?L.friends.map(x=>{ let a='';
        if(x.s.join&&!inRoom) a=`<button class="btn small primary" data-join="${esc(x.id)}">Join</button>`;
        a+=`<button class="btn small ghost gmx" data-unf="${esc(x.id)}" aria-label="Remove ${esc(nameOf(x.id))}">✕</button>`;
        return row(x.id,a,stLine(x.s)) }).join(''):`<li class="muted">No friends yet. Search for someone above, or share your username${acct&&acct.username?': <b>'+esc(acct.username)+'</b>':''}.</li>`}</ul>
      ${L.outgoing.length?`<span class="label">Sent requests</span><ul class="gmlist">${L.outgoing.map(x=>row(x.id,`<button class="btn small ghost" data-drop="${esc(x.id)}">Cancel</button>`,'<small>waiting for them</small>')).join('')}</ul>`:''}`;
  }
  // Invite friends: every friend with their own button, the ones online first. An invite waits 20 minutes, so a friend
  // who opens any Grudge Match game in that time still gets it.
  function inviteHTML(){
    const s=myState(), L=lists();
    if(s.st!=='room'||!s.code) return '<p class="muted">Open an online game first, then invite friends from its lobby.</p>';
    const row=(id,actions,line)=>`<li class="gmrow">${picHTML(id)}<span class="gmname"><b>${esc(nameOf(id))}</b>${line||''}</span><span class="gmact">${actions}</span></li>`;
    const reach=x=>pres.has(x.id), now=Date.now();
    const act=x=>{ const v=invOf(x.id); if(!v) return `<button class="btn small primary" data-inv="${esc(x.id)}">Invite</button>`;
      if(v.st==='now') return '<span class="gmtag ok">On the way</span>';
      if(v.st==='later') return '<span class="gmtag ok">After their game</span>';
      if(v.st==='joined') return '<span class="gmtag ok">Joined</span>';
      const again=now-v.at>SEND_AGAIN_MS?`<button class="btn small ghost" data-inv="${esc(x.id)}">Again</button>`:'';
      return `<span class="gmtag">${v.st==='no'?'Not now':'Invited ✓'}</span>${again}` };
    const line=x=>{ const v=invOf(x.id), st=x.s;
      const t=v&&v.st==='later'?'Accepted · joins when their game ends':v&&v.st==='now'?'Accepted · joining now':st.text;
      return `<small><i class="gmst ${st.dot}"></i>${esc(t)}</small>` };
    const list=[...L.friends].sort((a,b)=>((b.s.rank>=2)-(a.s.rank>=2))||b.s.rank-a.s.rank||nameOf(a.id).localeCompare(nameOf(b.id)));
    const fresh=list.filter(x=>x.s.rank>=2&&!invOf(x.id));
    return `<div class="gminvhead"><p class="muted">Game code <b>${esc(s.code.toUpperCase())}</b>. Friends playing another Grudge Match game get the invite there.</p>
      ${fresh.length>1?`<button class="btn small primary" data-invall>Invite all online (${fresh.length})</button>`:''}</div>
      <ul class="gmlist">${list.length?list.map(x=>row(x.id,act(x),line(x))).join(''):'<li class="muted">No friends yet. Add some from the Friends tab.</li>'}</ul>`;
  }
  function openInvite(){ open('invite') }
  // the round profile button next to the other header bubbles: your picture once signed in, plus a count of requests or friends online
  function btnHTML(){
    if(!enabled) return '';
    const k=user&&prof?avKey(prof.avatar):'', s=avSrc(k);
    return `<button class="iconbtn gmbtn${s?' has-pic':''}" id="gmBtn" aria-label="Profile and friends" title="Profile and friends">${s?`<img src="${s}" alt="">`:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.8-3.9 3.6-6 7.2-6s6.4 2.1 7.2 6"/></svg>`}<span class="gmbadge" hidden></span></button>`;
  }
  function badge(){
    const L=user?lists():null, inc=L?L.incoming.length:0, n=L?L.friends.filter(x=>x.s.rank>=2).length:0;
    document.querySelectorAll('.gmbadge').forEach(b=>{ b.hidden=!inc&&!n; b.textContent=inc?String(inc):String(n); b.classList.toggle('req',!!inc) });
  }
  function wire(root){ const b=(root||document).querySelector('#gmBtn'); if(b) b.onclick=()=>{ try{ sfx('tap') }catch(e){} open() }; badge() }
  // friends' best Fliptide scores, for the leaderboard's Friends tab
  function board(){
    if(!user) return [];
    const ids=[user.id,...lists().friends.map(x=>x.id)];
    return ids.map(id=>{ const f=id===user.id?prof:fprofs.get(id), st=f&&f.stats||{}; return {id,name:nameOf(id)+(id===user.id?' (you)':''),av:avKey(f&&f.avatar),score:st.best||0,ts:st.last||0,games:st.games||0} })
      .filter(e=>e.games).sort((a,b)=>b.score-a.score||a.ts-b.ts).slice(0,10);
  }
  return {enabled,init,open,openInvite,close,set _go(f){ go=f },wire,btnHTML,badge,recordGame,fromGame,board,get user(){ return user },get prof(){ return prof },_lists:()=>user?lists():null};
})();
function start(d){
  try{ applyAccess() }catch(e){}
  const sp=document.getElementById('splash');
  if(d&&d.S){ if(sp) sp.remove() } else if(sp) try{ startSplash() }catch(e){ console.error('splash',e); sp.remove() }
  try{ startTheme() }catch(e){ console.error('theme',e) }
  try{ checkUpdate() }catch(e){}
  try{ lbWatch(); setInterval(lbWatch,60000) }catch(e){}
  try{ SOC.init() }catch(e){ console.warn('social',e) }
  try{ const j=new URLSearchParams(location.search).get('join'); if(j){ const u=new URL(location.href); u.searchParams.delete('join'); history.replaceState(null,'',u.href); setTimeout(()=>joinByCode(j.replace(/[^a-z]/gi,'').slice(0,4)),300) } }catch(e){}
  try{ const q=new URLSearchParams(location.search).get('game'); if(q){ const u=new URL(location.href); u.searchParams.delete('game'); history.replaceState(null,'',u.href); setTimeout(()=>openSavedGame(q),300) } }catch(e){}
  const saved=load();
  S=(d&&d.S&&!d.S.net)?d.S:setupState(loadSetup()||(saved&&saved.setup)||undefined);
  if(S.phase==='anim'||S.phase==='peeking') S.phase='flip';
  if(S.players) for(const p of S.players){p.kind=p.kind||'human';p.mem=p.mem||{}}
  S.tick=S.tick||0; S.turnNo=S.turnNo||0;
  clearTimeout(aiTimer); aiTimer=null;
  boardEl=null; busy=false; away.clear();
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
