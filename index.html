/* full screen height even while a phone's browser bars slide in and out (lvh = the tallest the screen gets) */
body::before,body::after{content:"";position:fixed;top:0;left:0;right:0;height:100vh;height:100lvh;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,40,46,.18),rgba(6,40,46,.32)),var(--water) center/cover no-repeat,#2f9ea3}
/* the same water again, clipped to the strip behind the phone's status bar and laid over the page, so text never scrolls under it */
body::after{z-index:9;-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(var(--safe-top,0px) * .75),transparent var(--safe-top,0px));
  mask-image:linear-gradient(to bottom,#000 0,#000 calc(var(--safe-top,0px) * .75),transparent var(--safe-top,0px))}
/* text that sits straight on the water gets a light color and a soft shadow so it stays readable */
.top .muted,.info,.app > .foot,.splash .foot,.credit,.studio-link{color:#eef8f6;text-shadow:0 1px 2px rgba(0,20,30,.85),0 0 8px rgba(0,20,30,.5)}
.top h1,.logo{text-shadow:0 1px 2px rgba(0,20,30,.85),0 2px 10px rgba(0,20,30,.55)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
/* --safe-top is how much of the top the phone's status bar covers (measured in script) */
.app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:calc(var(--safe-top,0px) + 14px) 140px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:var(--dw,600);margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:2.6rem;letter-spacing:.01em}
h2{font-size:1.9rem}
h3{font-size:1.35rem}
p{margin:0}
.muted{color:var(--ink-2)}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);font-weight:700}

/* buttons */
.btn{border:0;border-radius:999px;padding:.7em 1.3em;font-weight:700;background:var(--panel-2);transition:transform .12s, filter .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--sea);color:var(--sea-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--panel-2);color:var(--ink-2)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.small{padding:.45em .95em;font-size:.88rem}

/* header */
.menu-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:4px}
.menu-top h1{margin:0}
.menu-logo img{display:block;width:min(69vw,352px);height:auto;filter:drop-shadow(0 6px 14px rgba(0,30,40,.35))}
.menu-top .muted{color:#eef8f6;text-shadow:0 1px 3px rgba(4,36,42,.55);margin:0}
.sharebtn{display:inline-flex;align-items:center;gap:8px;margin-top:8px;background:var(--sea);color:var(--sea-ink)}
.sharebtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.installtip{border:1.5px solid color-mix(in srgb,var(--sea) 55%,transparent)}
.installtip h3{margin:0}
.installhead{display:flex;align-items:center;gap:14px}
.installtip .appicon{width:64px;height:64px;border-radius:15px;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.12)}
.btnrow.left{justify-content:flex-start}
.menu-top .tools{display:flex;gap:8px;margin-top:4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top .tools{display:flex;gap:8px}

/* setup */
.card{background:color-mix(in srgb,var(--panel) var(--card-a,92%),transparent);-webkit-backdrop-filter:var(--card-blur,none);backdrop-filter:var(--card-blur,none);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:50%;border:0;background:var(--panel-2);font-size:1.4rem;font-weight:700}
.stepper output{font-family:var(--display);font-size:2.2rem;min-width:1.5ch;text-align:center;font-variant-numeric:tabular-nums}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.name{display:flex;align-items:center;gap:10px;background:var(--table-2);border-radius:12px;padding:6px 6px 6px 12px}
.name i{width:14px;height:14px;border-radius:50%;flex:none}
.avbtn{width:38px;height:38px;flex:none;border-radius:50%;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 30%,transparent);display:grid;place-items:center;padding:0;cursor:pointer;color:var(--c);font:700 1.1rem/1 var(--body)}
.avbtn.has-av{background:color-mix(in srgb,var(--c) 45%,transparent)}
.avbtn img,.chip i.has-av img,.bar .avatar.has-av img{width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
.chip i.has-av{width:26px;height:26px;margin:-3px 0}
.bar .avatar.has-av{background:color-mix(in srgb,var(--c) 55%,transparent)}
.whoav{width:84px;height:84px;object-fit:contain;margin:4px auto -4px;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.rowav{width:26px;height:26px;border-radius:50%;object-fit:contain;padding:2px;box-sizing:border-box;flex:none}
.lbav{display:inline-block;width:28px;height:28px;object-fit:contain;vertical-align:middle;margin-right:8px;flex:none}
.seatav{width:28px;height:28px;border-radius:50%;object-fit:contain;flex:none}
.lbav.none{border-radius:50%;background:color-mix(in srgb,var(--ink,#fff) 12%,transparent);width:22px;height:22px;margin:0 11px 0 3px}
/* Grudge Match profile and friends */
.gmbtn{position:relative}
.gmbtn.has-pic{padding:0;overflow:visible}
.gmbtn.has-pic img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.gmbtn svg{fill:none;stroke:currentColor;stroke-width:1.8}
.gmbadge{position:absolute;top:-5px;right:-6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#3ddc84;color:#0b2416;font:700 11px/17px var(--body);text-align:center;box-sizing:border-box}
.gmbadge.req{background:var(--bust);color:#2a0d05}
.gmsheet{display:grid;grid-template-columns:minmax(0,1fr);place-items:center;z-index:72}
.gmbox{text-align:left;align-items:stretch;box-sizing:border-box;min-width:0;width:min(100%,460px);max-height:min(92vh,760px);display:flex;flex-direction:column}
.gmbox h2{text-align:center}
.gmbody{overflow:auto;display:flex;flex-direction:column;gap:10px;padding:2px;min-height:0}
.gmtabs{margin-bottom:12px;align-self:stretch;width:auto}
.gmbox .label{text-align:left}
.gmname{text-align:left}
.gmbox .gmwho .label{margin:0}
.gmdot{font-style:normal;display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--bust);color:#2a0d05;font-size:11px;line-height:16px;font-weight:700}
.gmoauth{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f2330;border-color:#d6dae3}
.gmor{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.1em}
.gmor::before,.gmor::after{content:'';flex:1;height:1px;background:color-mix(in srgb,var(--ink) 20%,transparent)}
.gmform{display:flex;flex-direction:column;gap:8px}
.gmform input,.gmsearch,.gmwho input{width:100%;min-width:0;box-sizing:border-box;border:2px solid color-mix(in srgb,var(--ink) 18%,transparent);background:var(--table-2);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px}
.gmmsg{color:var(--wood-2);text-align:center;margin:8px 0 0}
.gmme{display:flex;gap:14px;align-items:center}
.gmbig{position:relative;flex:none;width:84px;height:84px;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);box-shadow:none}
.gmbig span{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:11px;background:var(--sea);color:#fff;border-radius:8px;padding:1px 7px}
.gmavbig{display:grid;width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--table-2);display:grid;place-items:center;font-size:2rem;font-weight:700}
.gmwho{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.gmpicks{display:flex;flex-direction:column;gap:8px;align-items:center}
.gmup{cursor:pointer}
.gmstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gmstats div{background:var(--table-2);border-radius:12px;padding:8px 4px;text-align:center}
.gmstats b{display:block;font-size:1.3rem}
.gmstats small{color:var(--ink-2);font-size:.75rem}
.gmlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.gmrow{display:flex;align-items:center;gap:10px;background:var(--table-2);border-radius:14px;padding:7px 8px}
.gmav{display:grid;width:38px;height:38px;border-radius:50%;flex:none;object-fit:cover;background:var(--panel-2);display:grid;place-items:center;font-weight:700}
.gmname{flex:1;min-width:0;display:flex;flex-direction:column}
.gmname b,.gmname small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gmname small{color:var(--ink-2);font-size:.78rem}
.gmact{display:flex;gap:4px;flex:none}
.gmtag{font-size:.75rem;font-weight:700;color:var(--ink-2);padding:0 4px;align-self:center}
.gmx{padding-left:9px;padding-right:9px}
.gmst{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#6b7080}
.gmst.on{background:#3ddc84}.gmst.play{background:#f5c04a}.gmst.other{background:#56b4e9}
.gmtoast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;width:min(calc(100% - 32px),440px);box-sizing:border-box;background:var(--panel);border:1px solid color-mix(in srgb,var(--sea) 50%,transparent);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.gmtoast p{flex:1;min-width:140px;margin:0}
.gmtoast.top{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
.gmtbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;width:100%}
.gmtag.ok{color:#3ddc84}
.gminvhead{display:flex;flex-direction:column;gap:8px}
.gminvhead p{margin:0}
.gminvite{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:6px 0 10px}
.gminvite svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.avpick{display:grid;place-items:center;z-index:70}
.avgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:min(100%,440px);margin:0 auto;max-height:min(62vh,520px);overflow:auto;padding:4px;box-sizing:border-box}
@media (min-width:560px){.avgrid{grid-template-columns:repeat(6,minmax(0,1fr));width:min(100%,520px)}}
.avopt{aspect-ratio:1;min-width:0;border:2px solid transparent;border-radius:18px;background:var(--table-2);padding:6px;cursor:pointer}
.avopt img{width:100%;height:100%;object-fit:contain;display:block}
.avopt.on{border-color:var(--sea);background:color-mix(in srgb,var(--sea) 25%,var(--table-2))}
.name input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;padding:8px 4px}
.name select{flex:none;background:var(--panel-2);border:0;border-radius:9px;color:var(--ink);font:inherit;font-size:.85rem;padding:8px 6px}
.name.bot{background:color-mix(in srgb,var(--sea) 10%,var(--table-2))}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.tray.fishes{grid-template-columns:repeat(5,1fr)}
.tray figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.78rem;color:var(--ink-2)}
.tray .face{width:56px;height:56px}
.tray b{color:var(--ink);font-variant-numeric:tabular-nums}

/* token faces */
.face{border-radius:50%;color:var(--burn);
  background:
    radial-gradient(circle at 34% 28%, rgba(255,255,255,.35), transparent 45%),
    repeating-radial-gradient(circle at 70% 120%, transparent 0 7px, rgba(120,72,36,.07) 7px 8px),
    radial-gradient(circle at 50% 50%, var(--wood) 0 55%, var(--wood-2) 100%);
  box-shadow:inset 0 0 0 1px rgba(80,40,10,.18), 0 2px 0 var(--wood-3), 0 4px 8px rgba(0,0,0,.45);
  display:grid;place-items:center;overflow:hidden}
.face svg{width:84%;height:84%}
.face.bust{box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--bust) 70%,transparent), 0 2px 0 var(--wood-3), 0 4px 8px rgba(0,0,0,.45)}

/* scoreboard */
/* fixed grid: the scoreboard keeps the same size all game */
.scores{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:6px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 9px 5px 5px;border-radius:999px;background:var(--table-2);border:1.5px solid transparent;font-size:.88rem;min-width:0;height:34px;box-sizing:border-box;white-space:nowrap;overflow:hidden}
.chip.seehand{cursor:pointer}
.handgrid{display:flex!important;flex-wrap:wrap;justify-content:center;gap:14px;margin:10px 0}
.handgrid figure{margin:0;text-align:center;width:88px;flex:none}.handgrid .face{width:64px;height:64px;margin:0 auto 4px}
.handgrid figcaption{font-size:.85rem}
.chip i{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:.7rem;font-weight:700;color:#1a120d}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.chip b{font-variant-numeric:tabular-nums;flex:none}
.chip b small{color:var(--sea);font-size:.8em;margin-left:2px}
.chip i.bot{font-size:.6rem;letter-spacing:.02em}
/* 5+ players: two-line tiles with a color stripe, so names stay readable */
.scores.compact .chip{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;align-content:center;column-gap:4px;row-gap:0;height:42px;border-radius:10px;padding:3px 8px 3px 11px;box-shadow:inset 4px 0 0 var(--c)}
.scores.compact .chip i{display:none}
.scores.compact .chip span{grid-column:1 / -1;font-size:.8rem;font-weight:700;line-height:1.2}
.scores.compact .chip b{grid-column:1;font-size:.85rem;line-height:1.2}
.scores.compact .chip em{display:block;grid-column:2;grid-row:2;font-style:normal;font-size:.62rem;font-weight:700;letter-spacing:.06em;color:var(--ink-2);align-self:center}
.chip em{display:none}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--table-2))}
.info{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.85rem;color:#eef8f6;text-shadow:0 1px 2px rgba(0,20,30,.85),0 0 8px rgba(0,20,30,.5)}
.info b{color:var(--ink);font-variant-numeric:tabular-nums}

/* board: tokens scattered at random spots on the table */
.boardwrap{width:100%;position:relative;touch-action:none}
.boardwrap.zoomed{overflow:hidden;border-radius:14px}
.board{transform-origin:0 0}
.zoomreset{position:absolute;top:6px;right:6px;z-index:8;width:40px;height:40px;font:700 .8rem/1 var(--body)}
.zoomreset[hidden]{display:none}
/* accessibility mode: zoom buttons, and arrows on each edge once zoomed in */
.boardwrap .acc-zoom,.boardwrap .acc-pan{display:none}
.access .acc-zoom{display:flex;flex-direction:column;gap:8px;position:absolute;right:6px;top:64px;z-index:8}
.boardwrap .acc-zoom .iconbtn,.boardwrap .acc-pan{width:50px;height:50px;font:700 1.5rem/1 var(--body)}
.access .boardwrap.zoomed .acc-pan{display:grid;position:absolute;z-index:8}
.acc-pan.up{top:6px;left:calc(50% - 25px)} .acc-pan.down{bottom:6px;left:calc(50% - 25px)}
.acc-pan.left{left:6px;top:calc(50% - 25px)} .acc-pan.right{right:6px;top:calc(50% - 25px)}
.boardwrap .acc-pan.off,.boardwrap .acc-zoom .iconbtn.off{opacity:.35}
.boardwrap .acc-pan,.boardwrap .acc-zoom .iconbtn{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.access .zoomreset{right:auto;left:6px;top:64px;width:50px;height:50px;font-size:1rem}
.acc-pan.up-left{top:6px;left:6px} .acc-pan.up-right{top:6px;right:6px} .acc-pan.down-left{bottom:6px;left:6px} .acc-pan.down-right{bottom:6px;right:6px}
.board{position:relative;margin:0 auto;width:100%;
  aspect-ratio:1 / var(--h);
  background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.22), transparent 70%)}
.tok{position:absolute;aspect-ratio:1;border:0;padding:0;background:none;perspective:600px;border-radius:50%}
.tok .tilt{position:absolute;inset:0;transform:rotate(var(--r,0deg))}
/* on small screens a token swells to double size as it flips face up, nudged inward so it stays on the table */
.tok.swell{z-index:6;animation:tokSwell 1.5s cubic-bezier(.3,.8,.3,1) both}
.tok.swell .front{filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
@keyframes tokSwell{0%{transform:none}24%{transform:translate(var(--sx,0px),var(--sy,0px)) scale(2)}76%{transform:translate(var(--sx,0px),var(--sy,0px)) scale(2)}100%{transform:none}}
.tok .inner,.fly .inner{position:absolute;inset:0;transform-style:preserve-3d}
.tok .inner{transition:transform .42s cubic-bezier(.3,.7,.3,1.2)}
.tok.up .inner{transform:rotateY(180deg)}
.tok .back,.tok .front,.fly .back,.fly .front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tok .back,.fly .back,.pile .stack i{
  border-radius:50%;
  background:
    radial-gradient(circle at 34% 28%, rgba(255,255,255,.3), transparent 42%),
    repeating-radial-gradient(circle at 20% -30%, transparent 0 6px, rgba(110,66,30,.08) 6px 7px),
    radial-gradient(circle, var(--wood) 0 50%, var(--wood-2) 100%);
  box-shadow:inset 0 0 0 1px rgba(80,40,10,.2), 0 2px 0 var(--wood-3), 0 4px 7px rgba(0,0,0,.5)}
.tok .front,.fly .front{transform:rotateY(180deg)}
.tok .front .face,.fly .front .face{width:100%;height:100%}
.tok.pick{cursor:pointer}
.tok.pick:hover .back{filter:brightness(1.08)}
.tok:not(.pick){cursor:default}
.tok.away{visibility:hidden}
.tok.aim .back{box-shadow:inset 0 0 0 1px rgba(80,40,10,.2),0 0 0 4px var(--c,var(--sea)),0 8px 14px rgba(0,0,0,.55);filter:brightness(1.08)}
.tok.aim .tilt{transform:rotate(var(--r,0deg)) scale(1.08) translateY(-2px);transition:transform .25s}
.board.dim .tok.pick .back{box-shadow:inset 0 0 0 1px rgba(80,40,10,.2),0 0 0 3px color-mix(in srgb,var(--sea) 55%,transparent),0 4px 7px rgba(0,0,0,.5)}

/* the shark swims across the screen while the table churns behind it */
.sharkswim{position:fixed;left:0;z-index:31;pointer-events:none;animation:jfSwimX var(--dur) cubic-bezier(.45,.05,.55,.95) both;will-change:transform}
.sharkswim .bob{display:block;animation:jfSwimBob .55s ease-in-out infinite alternate}
.sharkswim img,.sharkswim svg{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.sharkswim svg{color:var(--wood);stroke-width:3.2}
.sharkswim.left img{transform:scaleX(-1)}
@keyframes jfSwimX{from{transform:translateX(var(--x0))}to{transform:translateX(var(--x1))}}
@keyframes jfSwimBob{from{transform:translateY(-5px) rotate(-3deg)}to{transform:translateY(5px) rotate(3deg)}}
/* whirlpool swap: the first token picked */
.tok.sel .back{box-shadow:inset 0 0 0 1px rgba(80,40,10,.2),0 0 0 4px var(--sea),0 8px 14px rgba(0,0,0,.55)}
.tok.sel .tilt{transform:rotate(var(--r,0deg)) scale(1.1) translateY(-3px)}

/* splash */
.splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(180deg,rgba(6,40,46,.12),rgba(6,40,46,.3)),var(--water) center/cover no-repeat,#2f9ea3;transition:opacity .6s}
/* while it melts away the landing page still catches taps, so the tap on Play can't fall through onto the menu underneath */
.splash.out #splashGo{pointer-events:none}
#splashGo{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.popfx .ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:none;animation:jfRing 1.1s cubic-bezier(.2,.7,.3,1) var(--dl) both}
.popfx .bub{background:none;border:0;animation:jfRise var(--d) cubic-bezier(.22,.61,.36,1) var(--dl) both}
.popfx .bub s{position:absolute;inset:0;animation:jfSway calc(var(--d) * .5) ease-in-out var(--dl) infinite alternate}
.popfx .bub b{position:absolute;inset:0;border-radius:50%;box-sizing:border-box;border:1.5px solid rgba(255,255,255,.75);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9) 0 12%,rgba(255,255,255,.18) 13% 45%,rgba(160,230,225,.12) 70%,rgba(255,255,255,.35) 100%);
  animation:jfSwell var(--d) cubic-bezier(.2,1.3,.4,1) var(--dl) both,jfBubFade var(--d) linear var(--dl) both}
.popfx .ghost{animation:jfGhost .28s ease-out both}

  el.innerHTML=`<span class="inner"><span class="back"></span><span class="front">${t?face(t):''}</span></span>`;

// ---------- moves ----------
// Fly every fish and starfish revealed this turn to the current player, then bank them.
async function bankFlights(){
  const items=S.turn.rev.filter(i=>isCatch(S.slots[i]));
  if(!items.length) return 0;
  const from=items.map(i=>centerOf(tokEl(i)));
  items.forEach(i=>away.add(S.slots[i].id)); render();
  const dot=chipTarget(), to={...dot,s:dot.s*1.3};
  items.forEach((_,k)=>setTimeout(()=>sfx('plip',k),(560+k*130)*M()));
  await Promise.all(items.map((i,k)=>fly(from[k],to,{t:S.slots[i].t,up:true,dur:620,delay:k*130})));
  let pts=0; const pairs0=fishPairs(P());
  for(const i of items){const s=S.slots[i];P().bank.push(s.t);pts+=TYPES[s.t].pts;away.delete(s.id);S.slots[i]=null;forget(i)}
  pts+=fishPairs(P())-pairs0;
  S.turn.rev=S.turn.rev.filter(i=>S.slots[i]); S.turn.banked+=pts; bump(S.cur); render();
  return pts;
}

async function toCard(i,card){

}

  await fly(from,centerOf(pileEl()),{t:s.t,up:cardUp(),upEnd:false,dur:650});
  sfx('thud'); S.scrap.push(s.t); scrapSeen(s.t); away.delete(s.id); S.slots[i]=null; forget(i); S.turn.rev=S.turn.rev.filter(j=>j!==i);

async function flipDownAll(){ if(S.slots.some(s=>s&&s.up)){ S.slots.forEach(s=>{if(s) s.up=false}); render(); await wait(480) } }

// Banked tokens return one at a time, face up, then turn face down where they land.
// The larger half of the hand drops back onto the table all at once; the table gets mixed right after, so there is nothing to track.
async function sharkReturn(){
  const p=P(), lose=Math.ceil(p.bank.length/2); gshuffle(p.bank);
  const from=chipTarget(), moves=[];
  for(let k=0;k<lose;k++){
    const t=p.bank.pop(), e=empties();
    if(!e.length){ S.scrap.push(t); scrapSeen(t); continue }
    const spot=gpick(e); S.slots[spot]={id:S.nextId++,t,up:false}; moves.push([spot,t]);
  }
  for(const [spot] of moves) away.add(S.slots[spot].id);
  bump(S.cur); render();
  await Promise.all(moves.map(([spot,t],k)=>fly(from,spotCenter(spot),{t,up:true,upEnd:false,dur:600,delay:k*70})));
  for(const [spot] of moves) away.delete(S.slots[spot].id);
  if(moves.length) sfx('thud');
  render(); await wait(250);
  return lose;
}
// The shark (or the whirlpool) churns the reef: every token rushes into the middle, churns out of sight, then scatters to brand-new spots.
async function swirl(art='shark'){ // art: 'shark' sends the shark swimming across; the whirlpool just churns
  const bw=boardEl.offsetWidth, bh=boardEl.offsetHeight, cx=bw/2, cy=bh/2, m=Math.min(bw,bh);
  const idx=S.slots.map((s,i)=>s?i:-1).filter(i=>i>=0);
  const before=new Map(idx.map(i=>[S.slots[i].id,{x:S.layout.spots[i].x*bw,y:S.layout.spots[i].y*bw}]));
  const toks=gshuffle(idx.map(i=>S.slots[i]));
  S.layout=makeLayout(S.h);
  const spots=gshuffle([...Array(S.slots.length).keys()]).slice(0,toks.length);
  S.slots=S.slots.map(()=>null); spots.forEach((sp,k)=>S.slots[sp]=toks[k]);
  forgetAll(); render();
  // put the tokens in a random stacking order so none stays on top
  shuffle([...tokMap.values()]).forEach(el=>boardEl.appendChild(el));
  const T=2300*M();
  sfx('whirl');
  const swim=art==='shark'?sharkSwim(T):null;
  const anims=spots.map(sp=>{
    const s=S.slots[sp], o=before.get(s.id), n={x:S.layout.spots[sp].x*bw,y:S.layout.spots[sp].y*bw};
    const ao=Math.atan2(o.y-cy,o.x-cx), ro=Math.hypot(o.x-cx,o.y-cy);
    const r0=m*(.03+Math.random()*.15), w=(5+Math.random()*7)*Math.PI, ph=Math.random()*6.28, amp=m*(.02+Math.random()*.08);
    const a1=ao+Math.PI*(1+Math.random()), aEnd=a1+w;
    let an=Math.atan2(n.y-cy,n.x-cx); while(an<aEnd+Math.PI*.6) an+=Math.PI*2;
    const rn=Math.hypot(n.x-cx,n.y-cy), kf=[], N=48;
    for(let k=0;k<=N;k++){
      const t=k/N; let a,r;
      if(t<.24){const u=t/.24, e=u*u*(3-2*u); a=ao+(a1-ao)*e; r=ro+(r0-ro)*e}
      else if(t<.72){const u=(t-.24)/.48; a=a1+w*u; r=r0+amp*Math.sin(ph+u*9)}
      else {const u=(t-.72)/.28, e=u*u*(3-2*u); const rEnd=r0+amp*Math.sin(ph+9); a=aEnd+(an-aEnd)*e; r=rEnd+(rn-rEnd)*e}
      kf.push({transform:`translate(${(cx+r*Math.cos(a)-n.x).toFixed(1)}px,${(cy+r*Math.sin(a)-n.y).toFixed(1)}px) rotate(${Math.round(t*900)}deg)`});
    }
    return animDone(tokMap.get(s.id).animate(kf,{duration:T,easing:'linear'}),T);
  });
  await Promise.all(anims); if(swim) await swim;
}
// The shark swims across the screen, in front of the board. Admins can upload their own picture in the Studio.
// the default swimmer: the shark drawing without its !!! marks, cropped to the body
const swimSharkSVG=()=>`<svg viewBox="6 22 84 44" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ART.shark.replace(/<path d="M40 68[^>]*\/>/,'').replace(/<g fill="currentColor" stroke="none"><circle cx="40" cy="86".*?<\/g>/,'')}</svg>`;
function sharkSwim(T,onTop){
  const e=THEME.sharkSwim||{}, src=srcOf(e), br=boardEl&&boardEl.isConnected?boardEl.getBoundingClientRect():{top:0,height:innerHeight,width:Math.min(innerWidth,720)};
  const w=Math.min(innerWidth*.9,Math.max(160,br.width*(e.size||.62))), el=document.createElement('div');

function tone(f0,f1,dur,{type='sine',vol=.15,delay=0,vib=0,lp=0}={}){

  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  if(vib){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=vib;lg.gain.value=f0*.07;l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+dur)}

function hiss(dur,{f0=800,f1=f0,q=1,vol=.15,delay=0}={}){
  const a=audio(); if(!a) return;

  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.05,dur/3)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f).connect(g).connect(master); src.start(t); src.stop(t+dur+.03);

// ---------- background music ----------
// A slow, quiet loop made on the fly: a warm pad under soft kalimba notes from a pentatonic scale, with an echo.
const mtof = m => 440*Math.pow(2,(m-69)/12);
const MUSIC={bus:null, timer:null, next:0, step:0, last:67, playing:false};
const CHORDS=[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,64]];  // Cmaj7 · Am7 · Fmaj7 · G6
const MELODY=[60,62,64,67,69,72,74,76];
const BEAT=60/68;
function musicBus(){
  const a=audio(); if(!a) return null;
  if(!MUSIC.bus){
    const bus=a.createGain(); bus.gain.value=0;
    const dl=a.createDelay(1), fb=a.createGain(), lp=a.createBiquadFilter();
    dl.delayTime.value=BEAT*.75; fb.gain.value=.32; lp.type='lowpass'; lp.frequency.value=1800;
    bus.connect(master); bus.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master);
    MUSIC.bus=bus;
  }
  return MUSIC.bus;
}
function padChord(notes,t,dur){
  const a=actx, f=a.createBiquadFilter(), g=a.createGain();
  f.type='lowpass'; f.frequency.value=850;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+2.2); g.gain.setValueAtTime(.05,t+dur-1); g.gain.exponentialRampToValueAtTime(.0001,t+dur+1.6);
  f.connect(g).connect(MUSIC.bus);
  for(const n of notes) for(const [type,det] of [['sine',0],['triangle',6]]){
    const o=a.createOscillator(); o.type=type; o.frequency.value=mtof(n); o.detune.value=det; o.connect(f); o.start(t); o.stop(t+dur+1.8);
  }
}
function pluck(n,t,vel){
  const a=actx, g=a.createGain(), o=a.createOscillator(), o2=a.createOscillator(), g2=a.createGain();
  o.type='sine'; o.frequency.value=mtof(n); o2.type='sine'; o2.frequency.value=mtof(n)*3.01; g2.gain.value=.18;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vel,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+1.4);
  o.connect(g); o2.connect(g2).connect(g); g.connect(MUSIC.bus);
  o.start(t); o2.start(t); o.stop(t+1.5); o2.stop(t+1.5);
}
function musicTick(){
  if(!actx||!MUSIC.playing) return;
  while(MUSIC.next<actx.currentTime+.5){
    const t=MUSIC.next, s=MUSIC.step, chord=CHORDS[Math.floor(s/16)%CHORDS.length];
    if(s%16===0) padChord(chord,t,BEAT*8);
    if(s%4===0) pluck(chord[0]+12,t,.035);
    if(s%2===0&&Math.random()<.55||s%2===1&&Math.random()<.15){
      const near=MELODY.filter(m=>Math.abs(m-MUSIC.last)<=5);
      const n=near[Math.floor(Math.random()*near.length)]; MUSIC.last=n;
      pluck(n,t,.045+Math.random()*.03);
    }
    if(Math.random()<.04) bubble(t,.025);
    MUSIC.next+=BEAT/2; MUSIC.step++;
  }
}
function musicStart(){
  if(!PREFS.music||MUSIC.playing) return;
  const custom=srcOf(THEME.audio&&THEME.audio.music);
  if(custom){ MUSIC.el=new Audio(custom); MUSIC.el.loop=true; MUSIC.el.volume=.45; MUSIC.el.play().catch(()=>{}); MUSIC.playing=true; return }
  const a=audio(); if(!a||!musicBus()) return;
  MUSIC.playing=true; MUSIC.next=a.currentTime+.15; MUSIC.step=0;
  MUSIC.bus.gain.cancelScheduledValues(a.currentTime);
  MUSIC.bus.gain.setValueAtTime(MUSIC.bus.gain.value,a.currentTime); MUSIC.bus.gain.linearRampToValueAtTime(.55,a.currentTime+4);
  clearInterval(MUSIC.timer); MUSIC.timer=setInterval(musicTick,120); musicTick();
}
function musicRestart(){ if(MUSIC.playing){ musicStop(); setTimeout(musicStart,950) } }
function quietForBackground(hidden){
  if(hidden===AWAY) return; AWAY=hidden;
  if(MUSIC.el) hidden?MUSIC.el.pause():(MUSIC.playing&&MUSIC.el.play().catch(()=>{}));
  if(!actx||!master) return;
  if(hidden){
    // cut to silence straight away (no fade: the app may be frozen before a fade could finish), unplug, then sleep
    clearInterval(MUSIC.timer);
    try{ master.gain.cancelScheduledValues(0); master.gain.value=0; master.disconnect() }catch(e){}
    actx.suspend().catch(()=>{});
  } else {
    try{ master.connect(actx.destination) }catch(e){}
    actx.resume().catch(()=>{}).then(()=>{ const n=actx.currentTime; master.gain.cancelScheduledValues(n); master.gain.setValueAtTime(0,n); master.gain.linearRampToValueAtTime(.8,n+.25); AUDIO_USED=Date.now();
      if(MUSIC.playing&&!MUSIC.el){ MUSIC.next=Math.max(MUSIC.next,n+.1); clearInterval(MUSIC.timer); MUSIC.timer=setInterval(musicTick,120) } });
  }
}
const touchDevice=matchMedia('(pointer:coarse)').matches;
addEventListener('visibilitychange',()=>quietForBackground(document.visibilityState==='hidden'));
addEventListener('pagehide',e=>{ quietForBackground(true); if(!e.persisted&&actx){ try{ actx.close() }catch(x){} } });
addEventListener('pageshow',e=>{ if(e.persisted&&actx&&actx.state==='closed'){ actx=null; master=null; MUSIC.bus=null; MUSIC.playing=false; quietForBackground(false) } });
document.addEventListener('freeze',()=>quietForBackground(true));
// on phones and tablets, the window loses focus as soon as the app switcher opens, a beat before the app is hidden
if(touchDevice){ addEventListener('blur',()=>quietForBackground(true)); addEventListener('focus',()=>{ if(document.visibilityState==='visible') quietForBackground(false) }) }
function musicStop(){
  if(!MUSIC.playing) return; MUSIC.playing=false;
  if(MUSIC.el){ MUSIC.el.pause(); MUSIC.el=null; return }
  const a=actx; if(a&&MUSIC.bus){ MUSIC.bus.gain.cancelScheduledValues(a.currentTime); MUSIC.bus.gain.setValueAtTime(MUSIC.bus.gain.value,a.currentTime); MUSIC.bus.gain.linearRampToValueAtTime(0,a.currentTime+.8) }
  setTimeout(()=>{ if(!MUSIC.playing) clearInterval(MUSIC.timer) },900);
}
// one soft bubble: a quick upward blip
function bubble(t,vol=.05){
  const a=actx; if(!a) return;
  const f=380+Math.random()*520, o=a.createOscillator(), g=a.createGain();
  o.type='sine'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*2.2,t+.07);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+.09);
  o.connect(g).connect(master); o.start(t); o.stop(t+.1);
}

async function firebaseRoom(cfg,report){
  const {AU,D,app,db}=await fbCore();
  const {getAuth,signInAnonymously}=AU, {ref,set,onValue,onDisconnect,remove,serverTimestamp}=D;
  report('signing-in');
  const uid=(await signInAnonymously(getAuth(app))).user.uid;

  const me=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
  const rooms={};

    const all=ref(db,`jf/rooms/${name}/peers`), mine=ref(db,`jf/rooms/${name}/peers/${me}`);
    let pres={}, peers=[], gone=false, unsub=null;
    const listeners=new Set();
    const self=()=>Object.freeze({peer:me,by:null,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:pres,updatedAt:Date.now()});

// ---------- online play ----------
// Lockstep: the host keeps the official list of moves and every device replays it with the same random seed,
// so everyone sees the same table and the same animations. Everything travels as room presence:
// the host's presence holds the game (seed, seats, move list); a remote player's presence holds their seat claim and their next move.
const NET={kind:null, lobby:null, room:null, role:null, code:null, g:null, peers:[], hosts:[], me:null, log:[], applied:0, ffUntil:0, ff:false, pending:null, reqN:0, hostHere:true, myName:'', setup:null};
let pumping=false;
const cleanName = v => String(v||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,16);

(async()=>{
  try{
    let r=null;

    else if(FIREBASE_CONFIG){
      NET.kind='firebase'; NET.status='loading';
      const report=(st,e)=>{ if(st==='error'){ NET.status='error'; NET.statusMsg=(e&&(e.code||e.message))||'unknown' } else if(NET.status!=='error') NET.status=st; renderLobby() };
      renderLobby();
      try{
        r=await Promise.race([firebaseRoom(FIREBASE_CONFIG,report),new Promise((_,no)=>setTimeout(()=>no({code:'timed out'}),20000))]);
      }catch(e){ report('error',e); console.warn('firebase',e); return }
    }
    if(!r) return;
    NET.lobby=r;
    r.onPeers(ch=>{
      NET.hosts=ch.peers.filter(p=>!p.sameTab&&p.presence&&p.presence.host&&p.presence.host.code).map(p=>({peer:p.peer,...p.presence.host}));
      renderLobby();
    },()=>{NET.lobby=null;renderLobby()});
    if(S&&S.screen==='setup') render();
  }catch(e){}
})();

function hostName(g){ const i=g.kinds.indexOf('human'); return i>=0?g.names[i]:'Host' }
function openSeats(g){ const here=new Set(NET.peers.map(p=>p.peer)); return g.kinds.filter((k,i)=>k==='remote'&&!(g.seats[i]&&here.has(g.seats[i]))).length }

}

// ----- host -----
async function hostOpen(st){
  const code=Array.from({length:4},()=>'abcdefghjkmnpqrstuvwxyz'[Math.floor(Math.random()*23)]).join('');
  let room; try{ room=await NET.lobby.join('jf-'+code) }catch(e){ NET.err='Couldn’t open an online game right now. Try again in a moment.'; return render() }
  const n=st.count;
  NET.room=room; NET.role='host'; NET.code=code; NET.setup=st; NET.err='';
  NET.g={v:1,code,st:'wait',names:st.names.slice(0,n).map((v,i)=>cleanName(v)||`Player ${i+1}`),kinds:st.kinds.slice(0,n),avs:(st.avatars||[]).slice(0,n).map(a=>a||''),seats:{},acks:{},seed:0,h:0,log:''};

function hostOnPeers(){
  const g=NET.g; if(!g) return;

  for(const p of NET.peers){
    if(p.sameTab) continue;

// ----- shared -----
function legal(a){
  const dm=/^D(\d{1,2})((?:d\d{1,2}s\d{1,2}){0,3})$/.exec(a);
  if(dm){
    const pairs=dolphinPairs(dm[2]), ks=pairs.map(x=>x[0]), sp=[+dm[1],...pairs.map(x=>x[1])];
    return S.phase==='dolphin'&&new Set(ks).size===ks.length&&new Set(sp).size===sp.length&&ks.every(k=>k<S.scrap.length)&&sp.every(i=>i<S.slots.length&&(!S.slots[i]||i===S.turn.act));
  }
  const m=/^([fp])(\d{1,2})$|^([xbck])$/.exec(a); if(!m) return false;
  const c=m[1]||m[3], s=S.slots[+m[2]];
  if(c==='f') return ['flip','hook','goggles'].includes(S.phase)&&!!s&&!s.up;
  if(c==='p') return S.phase==='peek'&&!!s&&!s.up&&!(S.turn.peeked||[]).includes(+m[2]);
  if(c==='x') return S.phase==='peeking';
  if(c==='b') return S.phase==='flip'&&turnPts()>0;
  if(c==='c') return S.phase==='card';
  if(c==='k') return S.phase==='card'&&!!S.turn.pending&&S.turn.pending.type==='hook';
  return false;
}
// Replay moves from the shared list one at a time; when catching up after joining, skip the animations.
async function pump(){
  if(pumping) return; pumping=true;
  try{
    while(S&&S.screen==='play'&&NET.applied<NET.log.length){
      while(busy) await new Promise(r=>setTimeout(r,30));
      NET.ff=NET.applied<NET.ffUntil-1;
      const a=NET.log[NET.applied++]; NET.pending=null;
      await applyAction(a);
    }
  } finally { pumping=false; NET.ff=false }
  if(S&&S.screen==='play'){ render(); hostProcessReqs() }
}

const getPath=(path)=>path.split('/').reduce((o,k)=>o&&o[k],editTheme());
async function removeOldAsset(path){
  const old=getPath(path); if(!old||!old.asset) return;
  // other sets may share the file after a duplicate; only delete it when nothing else uses it
  const copy=JSON.parse(JSON.stringify(editTheme())); const parts=path.split('/'); let o=copy; for(let i=0;i<parts.length-1;i++) o=o&&o[parts[i]]; if(o) delete o[parts[parts.length-1]];
  if(assetInUse(old.asset,editTheme())||themeAssetIds(copy).includes(old.asset)) return;
  const {D,db}=await adminCore(); try{ await D.remove(D.ref(db,'jf/assets/'+old.asset)) }catch(e){}
}
function readFile(file,as){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); as==='text'?r.readAsText(file):r.readAsDataURL(file) }) }
// shrink photos so every player downloads them quickly; keeps transparency
async function shrinkImage(file,max){
  if(file.type==='image/svg+xml'){ if(file.size>400e3) throw new Error('SVG is over 400 KB'); return readFile(file) }
  const url=await readFile(file), img=new Image(); img.src=url; await img.decode();
  const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
  c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/webp',.88);
}
async function uploadAsset(path,file,kind,extra={}){
  STUDIO.msg='Uploading…'; renderStudio();
  try{
    let data;
    if(kind==='image') data=await shrinkImage(file,extra.max||768);
    else if(kind==='audio'){ if(file.size>4.5e6) throw new Error('Sound files must be under 4.5 MB'); data=await readFile(file) }
    else { if(file.size>1.5e6) throw new Error('Font files must be under 1.5 MB'); data=await readFile(file) }
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const {D,db}=await adminCore();
    await D.set(D.ref(db,'jf/assets/'+id),data);
    ASSET[id]=data; idb.set(id,data);
    await removeOldAsset(path);
    const prev=getPath(path)||{};
    await saveTheme(path,{...(typeof prev==='object'?prev:{}),url:null,asset:id,...(extra.keep||{})});
  }catch(e){ STUDIO.msg='Upload failed: '+(e.message||e); renderStudio() }
}

// ---------- AI players ----------
// Each AI remembers what it has seen face up, by spot. At the start of each turn it "recalls" those memories:
// its most recent few (sure) are always right; older ones are recalled with a chance that fades with age,
// and weaker players sometimes put a token in the wrong spot nearby.
//   Easy: always the very latest token, the rest is hazy.  Medium: the latest 4, then fading.
//   Hard plays like a sharp human: the latest 5 for sure, then a good memory that fades slowly, with the odd mix-up or careless flip.
const AI = {
  easy:  {label:'Easy',   sure:1, base:.45, half:6,   confuse:.35, think:[1200,2000], caution:null, slip:.25},
  medium:{label:'Medium', sure:4, base:.8,  half:20,  confuse:.1,  think:[950,1600],  caution:.3,   slip:.05},
  hard:  {label:'Hard',   sure:5, base:.8,  half:50,  confuse:.03, think:[750,1250],  caution:.2,   slip:.03},
};
const KINDS=[['human','Human'],['easy','AI · Easy'],['medium','AI · Medium'],['hard','AI · Hard'],['remote','Remote player']];
const BOT_NAMES=['Coral','Barnacle','Kelp','Pebble','Squid','Marlin','Minnow','Nori'];
const isAI = p => !!p && !!AI[p.kind];
// Seats this device plays: every human seat offline; online, the host's own seats or the remote player's one seat.
function mine(seat){ const p=S.players&&S.players[seat]; if(!p||isAI(p)) return false; if(!S.net) return true; return S.net.host?p.kind==='human':seat===S.net.seat }
let aiTimer=null, beliefCache=null;
const rnd = ([a,b]) => a+Math.random()*(b-a);

function seeAll(i){ S.tick++; const t=S.slots[i].t; for(const p of S.players) if(isAI(p)) p.mem[i]={t,tick:S.tick} }
function forget(i){ for(const p of S.players) if(p.mem) delete p.mem[i] }
function forgetAll(){ for(const p of S.players) if(p.mem) p.mem={} }

function beliefFor(p){
  const fd=new Set(faceDown());
  if(!beliefCache||beliefCache.turn!==S.turnNo||beliefCache.p!==S.cur){
    const cfg=AI[p.kind], B={};
    const seen=Object.keys(p.mem).map(Number).filter(i=>fd.has(i)).sort((a,b)=>p.mem[b].tick-p.mem[a].tick);
    seen.forEach((i,rank)=>{ const e=p.mem[i];
      if(rank<cfg.sure){ B[i]=e.t; return }
      if(Math.random()>cfg.base*Math.exp(-(S.tick-e.tick)/cfg.half)) return;
      let slot=i;
      if(Math.random()<cfg.confuse){
        const sp=S.layout.spots[i], d=j=>Math.hypot(S.layout.spots[j].x-sp.x,S.layout.spots[j].y-sp.y);
        const near=[...fd].filter(j=>j!==i).sort((a,b)=>d(a)-d(b)).slice(0,3);
        if(near.length) slot=pick(near);
      }
      if(B[slot]==null) B[slot]=e.t;
    });
    beliefCache={turn:S.turnNo,p:S.cur,B,start:S.tick,target:1+Math.floor(Math.random()*6)};
  }
  // anything seen during this turn is fresh in mind
  const B={...beliefCache.B};
  for(const k in p.mem) if(p.mem[k].tick>beliefCache.start) B[k]=p.mem[k].t;
  for(const k in B) if(!fd.has(+k)) delete B[k];
  return B;
}

// Expected points from flipping a token the AI knows nothing about.
// Only public information: start from the full bag and take away every token anyone has seen leave the table
// (hands, the scrap pile as it was filled), whatever is face up now, and whatever this AI remembers.
function blindEV(p,B,pend){
  const c={};
  for(const t of ORDER) c[t]=TYPES[t].n;
  const out=t=>{ if(c[t]>0) c[t]-- };
  for(const q of S.players) q.bank.forEach(out);
  if(S.scrapMass) for(const t in S.scrapMass) c[t]=Math.max(0,c[t]-S.scrapMass[t]); else (S.seenScrap||[]).forEach(out);
  S.slots.forEach(s=>{ if(s&&s.up) out(s.t) });
  for(const k in B) out(B[k]);
  const U=Object.values(c).reduce((a,b)=>a+b,0); if(!U) return -99;
  const half=p.bank.reduce((a,t)=>a+TYPES[t].pts,0)/2;
  let ev=0;
  for(const t in c){
    const f=c[t]/U, T=TYPES[t];
    if(T.kind==='catch') ev+=f*T.pts;
    else if(T.kind==='bust') ev-=f*(pend+(t==='jelly'?1:0)+(t==='shark'?half:0));
    else if(t==='whirl') ev-=f*pend;
    else ev+=f*.6;
  }
  return ev;
}

function aiChooseFlip(p){
  const cfg=AI[p.kind], B=beliefFor(p), fd=faceDown(), pend=turnPts();
  const known=fd.filter(i=>B[i]), unknown=fd.filter(i=>!B[i]), of=t=>known.filter(i=>B[i]===t);
  const kindOf=i=>TYPES[B[i]].kind;
  if(Math.random()<cfg.slip && fd.length) return pend&&Math.random()<.5?-1:pick(fd);
  if(of('star').length) return pick(of('star'));
  const knownFish=known.filter(i=>isFish(B[i])), pairUp=knownFish.filter(i=>p.bank.includes(B[i]));
  if(pairUp.length) return pick(pairUp);
  if(knownFish.length) return pick(knownFish);
  if(of('extra').length&&(pend>0||p.kind==='hard')) return pick(of('extra'));
  if(pend===0){
    if(unknown.length) return pick(unknown);
    const acts=known.filter(i=>kindOf(i)!=='bust'); if(acts.length) return pick(acts);
    const order=p.bank.length?['jelly','shark']:['shark','jelly'];
    for(const t of order) if(of(t).length) return pick(of(t));
    return pick(fd);
  }
  if(p.kind==='easy') return pend>=beliefCache.target||!unknown.length?-1:pick(unknown);
  if(unknown.length&&blindEV(p,B,pend)>cfg.caution) return pick(unknown);
  const stops=known.filter(i=>kindOf(i)==='stop'&&B[i]!=='whirl'); if(stops.length) return pick(stops);
  return -1;
}

function aiTarget(p,purpose){
  const B=beliefFor(p), fd=faceDown().filter(i=>!(purpose==='peek'&&(S.turn.peeked||[]).includes(i))), unknown=fd.filter(i=>!B[i]);
  if(p.kind==='easy'&&Math.random()<.5) return pick(fd);
  if(purpose==='hook') for(const t of ['shark','jelly']){const k=fd.filter(i=>B[i]===t); if(k.length) return pick(k)}
  return unknown.length?pick(unknown):pick(fd);
}

function maybeAI(){
  if(aiTimer||busy||!S||S.screen!=='play'||S.rulesOpen||(S.net&&!S.net.host)) return;
  const p=P(); if(!isAI(p)||!['flip','card','peek','peeking','hook','goggles','dolphin'].includes(S.phase)) return;
  let d=rnd(AI[p.kind].think);
  if(S.phase==='card') d=1500+Math.random()*900;
  else if(S.phase==='peeking') d=600;
  else if(S.phase==='flip') d+=turnPts()*120 + (S.summary?700:0);
  aiTimer=setTimeout(()=>{aiTimer=null;aiAct()},d*PACE());
}
async function aim(i){
  const el=tokEl(i); if(!el) return;
  el.classList.add('aim'); await new Promise(r=>setTimeout(r,480*PACE())); el.classList.remove('aim');
}
async function aiAct(){
  if(busy||!S||S.screen!=='play'||S.rulesOpen||!isAI(P())||(S.net&&NET.applied<NET.log.length)) return;
  const p=P(), ph=S.phase;
  if(ph==='card'){ const pd=S.turn.pending, s=pd&&pd.type==='hook'&&S.slots[pd.slot]; if(s&&(isFish(s.t)||s.t==='star')) return act('k'); return act('c') }
  if(ph==='peeking') return act('x');
  if(ph==='flip'){ const i=aiChooseFlip(p); if(i<0) return act('b'); await aim(i); return act('f'+i) }
  if(ph==='peek'){ const i=aiTarget(p,'peek'); await aim(i); return act('p'+i) }
  if(ph==='hook'){ const i=aiTarget(p,ph); await aim(i); return act('f'+i) }
  if(ph==='goggles'){ const i=aiTarget(p,ph); await aim(i); return act('f'+i) }
  if(ph==='dolphin'){
    // bring back the shark as a trap only it knows about, then prizes it can collect later; easy players grab one at random
    const max=dolMax(), ks=[];
    if(p.kind==='easy'){ if(max) ks.push(Math.floor(Math.random()*S.scrap.length)) }
    else for(const t of ['shark','star','jelly',...FISH]) S.scrap.forEach((x,k)=>{ if(x===t&&ks.length<max&&!ks.includes(k)) ks.push(k) });
    const sp=shuffle(dolSpots()).slice(0,ks.length+1);
    return act('D'+sp[0]+ks.map((k,j)=>'d'+k+'s'+sp[j+1]).join(''));
  }
}

// ---------- turn flow ----------
// A tap on the board by a player at this device.
// the sea turtle card's Continue leads straight into another flip, so a token tap does both
const goAgainCard = () => S.phase==='card'&&S.turn.pending&&S.turn.pending.type==='extra';
function onSlot(i){
  const s=S.slots[i]; if(busy||!s||s.up||!mine(S.cur)||NET.pending) return;
  if(goAgainCard()){
    sfx('tap'); act('c');
    const seat=S.cur, tryFlip=()=>{ if(busy||NET.pending||(S.net&&NET.applied<NET.log.length)) return setTimeout(tryFlip,60);
      if(S.phase==='flip'&&S.cur===seat&&S.slots[i]&&!S.slots[i].up&&mine(S.cur)) act('f'+i) };
    return setTimeout(tryFlip,60);
  }
  if(['flip','hook','goggles'].includes(S.phase)){ if(S.net&&!S.net.host) tokEl(i)?.classList.add('aim'); act('f'+i) }
  else if(S.phase==='peek'){ if(S.net&&!S.net.host) tokEl(i)?.classList.add('aim'); act('p'+i) }
}
// Every move goes through here. Offline it plays at once; online the host adds it to the shared list.
function act(a){
  if(!S.net) return applyAction(a);
  if(S.net.host){ if(busy||NET.applied<NET.log.length||!legal(a)) return; hostAppend(a) }
  else sendReq(a);
}
function applyAction(a){
  if(!legal(a)) return;
  const c=a[0], i=+a.slice(1);
  if(c==='f'){ const ph=S.phase; return run(()=>ph==='flip'?doFlip(i):ph==='hook'?hookTap(i):goggleTap(i)) }
  if(c==='p') return run(()=>startPeek(i));
  if(c==='x') return run(endPeek);
  if(c==='b') return run(doBank);
  if(c==='c') return run(doContinue);
  if(c==='k') return run(hookKeep);
  if(c==='D'){ const m=/^D(\d+)(.*)$/.exec(a); return run(()=>dolphinPlace(+m[1],dolphinPairs(m[2]))) }
}
// After hooking a token you see it, then keep it or discard it. Fish, starfish and jellyfish go into your hand;
// anything else is put back face down in its spot. Discarding (Continue) sends it to the scrap pile.
const handable=t=>isFish(t)||t==='star'||t==='jelly';
async function hookKeep(){
  const pd=S.turn.pending, i=pd.slot, s=S.slots[i], p=P(), name=TYPES[s.t].name.toLowerCase();
  S.phase='anim';
  if(handable(s.t)){
    const from=centerOf(cardFace()), dot=chipTarget(); cardHidden=true; render();
    await fly(from,{...dot,s:dot.s*1.3},{t:s.t,up:cardUp(),dur:650}); sfx('plip');
    p.bank.push(s.t); away.delete(s.id); S.slots[i]=null; forget(i); S.turn.rev=S.turn.rev.filter(j=>j!==i);
    S.card=null; cardHidden=false; bump(S.cur); render(); await flipDownAll();
    return endTurn(TT('sumHookKeep',{name:p.name,banked:bankedNote(),token:name}));
  }
  await cardToSpot(i); await flipDownAll();
  endTurn(TT('sumHookBack',{name:p.name,banked:bankedNote(),token:name}));
}
// The hooked token is secret: it comes up face down, only the player with the hook sees its face (on their own screen),
// and it's kept, put back or discarded without anyone else seeing it.
async function hookTap(i){
  const s=S.slots[i], p=P(), me=mine(S.cur);
  sfx('hook'); S.turn.rev.push(i);
  if(isAI(p)){ S.tick++; p.mem[i]={t:s.t,tick:S.tick} }
  await cardToScrap(S.turn.act);
  S.turn.pending={type:'hook',slot:i};
  await toCard(i,{k:'hooked',t:s.t,secret:true,title:me?TT('hookedTitle',{token:TYPES[s.t].name}):TT('hookedTitleWatch'),body:TT(!me?'hookedWatch':handable(s.t)?'hookedBody':'hookedBackBody',{name:p.name})});
  S.phase='card';
}
async function goggleTap(i){
  const s=S.slots[i];
  {
    sfx('flip'); s.up=true; S.turn.rev.push(i); seeAll(i); S.turn.picks--;
    S.card.body=TT(!mine(S.cur)?'subMoreWatch':'subMore',{name:P().name,more:plural(S.turn.picks,'more token')});
    render(); await wait(480);
    if(S.turn.picks<=0||!faceDown().length){
      await cardToScrap(S.turn.act);
      S.turn.pending={type:'look'};
      S.card={k:'look',t:null,title:TT('lookTitle'),body:TT('lookBody')};
      S.phase='card';
    }
  }
}

function bustBody(t,last){
  const p=P();
  if(t==='shark'&&last){ const n=p.bank.length; return n?TT('sharkLast',{lose:Math.ceil(n/2),tokens:plural(n,'token'),name:p.name}):TT('sharkLastEmpty',{name:p.name}) }
  if(t==='jelly') return TT('jellyBody',{name:p.name});
  if(t==='shark'){const n=p.bank.length,l=Math.ceil(n/2);
    return n?TT('sharkBody',{lose:l,tokens:plural(n,'token'),name:p.name}):TT('sharkEmpty',{name:p.name})}
  return '';
}
// The dolphin's player picks up to 3 scrap tokens, then hides them and the dolphin itself in spots of their choice.
// The dolphin dives into the scrap pile first, so everything comes back out looking the same; only the hider knows what went where.
let DOL={picks:[],confirmed:false,spots:[]};
const resetDol=()=>{ DOL={picks:[],confirmed:false,spots:[]} };
const dolphinPairs=a=>[...a.matchAll(/d(\d+)s(\d+)/g)].map(m=>[+m[1],+m[2]]);
const dolSpots=()=>[...empties(),S.turn.act].filter(i=>i!=null);
const dolMax=()=>Math.min(3,S.scrap.length,empties().length);
async function dolphinPlace(dSpot,pairs){
  const p=P(), di=S.turn.act, dol=S.slots[di], types=pairs.map(([k])=>S.scrap[k]);
  [...pairs.map(([k])=>k)].sort((x,y)=>y-x).forEach(k=>S.scrap.splice(k,1));
  scrapTaken(types.length);
  resetDol(); S.phase='anim';
  const c0=centerOf(cardFace()); cardHidden=true; render();
  await fly(c0,centerOf(pileEl()),{t:'dolphin',up:true,upEnd:false,dur:650});
  S.slots[di]=null; forget(di); away.delete(dol.id); S.card=null; cardHidden=false;
  S.turn.rev=S.turn.rev.filter(j=>j!==di); S.turn.act=null;
  const items=gshuffle([['dolphin',dSpot],...pairs.map(([,spot],j)=>[types[j],spot])]);
  items.forEach(([t,spot])=>{ S.slots[spot]={id:S.nextId++,t,up:false}; forget(spot); away.add(S.slots[spot].id);
    if(isAI(p)){ S.tick++; p.mem[spot]={t,tick:S.tick} } });
  render(); sfx('dolphin');
  const from=centerOf(pileEl());
  await Promise.all(items.map(([t,spot],j)=>fly(from,spotCenter(spot),{t,dur:1100,delay:j*200})));
  items.forEach(([,spot])=>away.delete(S.slots[spot].id));
  sfx('thud'); render(); await wait(250);
  endTurn(TT(types.length?'sumDolphinPlus':'sumDolphin',{name:p.name,banked:bankedNote(),tokens:plural(types.length,'token')}));
}

async function doFlip(i){
  const s=S.slots[i], T=TYPES[s.t], p=P();
  sfx('flip'); s.up=true; S.turn.rev.push(i); seeAll(i); S.summary=null; render();
  sfx(isFish(s.t)?'fish':T.kind==='catch'||T.kind==='bust'||s.t==='dolphin'?s.t:s.t==='extra'?'extra':'chime');
  if(s.t==='jelly'){ await wait(250); return jellyStings(i) }
  await wait(500);
  // the game ends once only 3 face-down tokens are left; a jellyfish, shark or whirlpool turns this turn's other tokens back over, so they still count
  // a shark or dolphin can put tokens back on the table, so it always plays out and the end of the turn decides whether the game is over
  const back=T.kind==='bust'||s.t==='whirl'?S.turn.rev.filter(j=>j!==i).length:0;
  if(faceDown().length+back<=3&&s.t!=='shark'&&s.t!=='dolphin') return lastFlip(i);
  if(T.kind==='catch') return;
  if(T.kind==='bust'){
    S.turn.pending={type:s.t,slot:i};
    await toCard(i,{k:s.t,t:s.t,title:TT('bustTitle',{token:T.name}),body:bustBody(s.t),bust:true});
    S.phase='card'; return;
  }
  // the whirlpool sweeps the catch away: nothing is banked, this turn's tokens flip back over, then everything swirls
  if(s.t==='whirl'){
    S.turn.act=i; S.turn.pending={type:'whirl'};
    await toCard(i,{k:'whirl',t:'whirl',title:TT('whirlTitle'),body:TT('whirlBody',{banked:'',name:p.name})});
    S.phase='card'; return;
  }
  // action token: bank the catch, then the token moves into the card and later on to the scrap pile
  const pts=await bankFlights(); S.turn.act=i;
  const banked=pts?TT('bankedPrefix',{points:plural(pts,'point')})+' ':'';
  if(s.t==='extra'){
    S.turn.pending={type:'extra'};
    await toCard(i,{k:'extra',t:'extra',title:TT('extraTitle'),body:TT('extraBody',{banked,name:p.name})});
    S.phase='card'; return;
  }
  if(s.t==='dolphin'){
    const max=dolMax();
    await toCard(i,{k:'dolphin',t:'dolphin',title:TT('dolphinTitle'),body:TT(!mine(S.cur)?'dolphinWatch':max?'dolphinMine':'dolphinEmpty',{banked,name:p.name,tokens:plural(max,'token')})});
    resetDol(); if(!max) DOL.confirmed=true; S.phase='dolphin'; return;
  }
  const fd=faceDown().length;
  if(s.t==='bigeye'){
    S.turn.picks=Math.min(3,fd);
    await toCard(i,{k:'mask',t:s.t,title:TT('maskTitle'),body:TT(!mine(S.cur)?'maskWatch':'maskMine',{banked,name:p.name,tokens:plural(S.turn.picks,'token')})});
    if(!fd){ await cardToScrap(i); return endTurn(TT('sumAction',{name:p.name,banked:bankedNote()})) }
    S.phase='peek'; return;
  }
  if(s.t==='hook'){
    await toCard(i,{k:'hook',t:s.t,title:TT('hookTitle'),body:TT(!mine(S.cur)?'hookWatch':'hookMine',{banked,name:p.name})});
    if(!fd){ await cardToScrap(i); return endTurn(TT('sumAction',{name:p.name,banked:bankedNote()})) }
    S.phase='hook'; return;
  }
  S.turn.picks=Math.min(T.picks,fd);
  await toCard(i,{k:'sub',t:s.t,title:TT('subTitle'),body:TT(!mine(S.cur)?'subWatch':'subMine',{banked,name:p.name,tokens:plural(S.turn.picks,'token')})});
  if(!S.turn.picks){ await cardToScrap(i); return endTurn(TT('sumAction',{name:p.name,banked:bankedNote()})) }
  S.phase='goggles';
}

// Only 3 face-down tokens left: the game ends on this flip. A catch is banked, a jellyfish or shark still costs you, actions don't happen.
// A jellyfish plays out on its own (no button): this turn's other tokens flip straight back over so nobody gets a long
// look at them, the jellyfish shows on the card for a moment, then goes into the hand for −1.
async function jellyStings(i){
  const s=S.slots[i], p=P(), others=S.turn.rev.filter(j=>j!==i);
  // the game ends once only 3 face-down tokens are left; the ones flipping back over still count
  const last=faceDown().length+others.length<=3; if(last) S.final=true;
  S.phase='anim';
  let back=false; for(const j of others) if(S.slots[j]&&S.slots[j].up){ S.slots[j].up=false; back=true }
  if(back){ render(); await wait(260) }
  S.turn.pending={type:'jelly',slot:i};
  await toCard(i,{k:last?'last':'jelly',t:'jelly',title:TT('bustTitle',{token:TYPES.jelly.name}),body:bustBody('jelly',last)+(last?' '+TT('lastFlip'):''),bust:true});
  await wait(last?1300:850);
  const from=centerOf(cardFace()), dot=chipTarget(); cardHidden=true; render();
  await fly(from,{...dot,s:dot.s*1.3},{t:'jelly',up:true,dur:560}); sfx('thud');
  p.bank.push('jelly'); away.delete(s.id); S.slots[i]=null; forget(i); S.card=null; cardHidden=false; bump(S.cur); render();
  await flipDownAll();
  endTurn(TT('sumStung',{name:p.name}));
}
async function lastFlip(i){
  const s=S.slots[i], T=TYPES[s.t], p=P(); S.final=true;
  if(T.kind==='bust'){
    S.turn.pending={type:s.t,slot:i};
    await toCard(i,{k:'last',t:s.t,title:TT('bustTitle',{token:T.name}),body:`${bustBody(s.t,true)} ${TT('lastFlip')}`,bust:true});
    S.phase='card'; return;
  }
  if(s.t==='whirl'){ S.endNote=TT('endWhirl',{name:p.name}); return finish() }
  const pts=await bankFlights();
  S.endNote=TT(T.kind==='catch'?'endCatch':'endAction',{name:p.name,points:plural(pts,'point'),token:T.name.toLowerCase()})+(T.kind!=='catch'&&pts?' '+TT('sumBanked',{name:p.name,points:plural(pts,'point')}):'');
  finish();
}

async function startPeek(i){
  S.turn.peek=i; S.turn.peeked=S.turn.peeked||[]; S.turn.peeked.push(i); const s=S.slots[i], p=P();
  if(isAI(p)){ S.tick++; p.mem[i]={t:s.t,tick:S.tick} }
  sfx('peek');
  if(mine(S.cur)){
    const from=centerOf(tokEl(i));
    away.add(s.id); S.phase='peeking'; cardHidden=false; render();
    const pf=document.getElementById('peekFace'); pf.style.visibility='hidden';
    await fly(from,centerOf(pf),{t:s.t,dur:750,up:false,upEnd:true});
    pf.style.visibility='';
  } else {
    // everyone else just sees the token lifted a little
    S.phase='peeking'; render();
    await animDone(tokEl(i).animate([{transform:'none'},{transform:'translateY(-6px) rotateX(35deg)'},{transform:'translateY(-6px) rotateX(35deg)',offset:.75},{transform:'none'}],{duration:1300*M()}),1300*M());
  }
}
async function endPeek(){
  const i=S.turn.peek, s=S.slots[i], pf=document.getElementById('peekFace');
  if(pf&&away.has(s.id)){
    const from=centerOf(pf); S.phase='anim'; render();
    await fly(from,spotCenter(i),{t:s.t,dur:750,up:true,upEnd:false});
    away.delete(s.id);
  } else S.phase='anim';
  render();
  // the snorkel mask gives several peeks, one at a time
  S.turn.picks--; S.turn.peek=null;
  const left=faceDown().filter(j=>!S.turn.peeked.includes(j)).length;
  if(S.turn.picks>0&&left){
    const p=P(), n=Math.min(S.turn.picks,left); S.turn.picks=n;
    S.card={...S.card,body:TT(mine(S.cur)?'peekMore':'peekMoreWatch',{name:p.name,more:plural(n,'more token'),peeks:plural(n,'peek')})};
    S.phase='peek'; return;
  }
  const n=S.turn.peeked.length;
  await cardToScrap(S.turn.act);
  endTurn(TT('sumPeek',{name:P().name,banked:bankedNote(),tokens:plural(n,'token')}));
}

async function doBank(){ const pts=await bankFlights(); endTurn(TT('sumBanked',{name:P().name,points:plural(pts,'point')})) }

async function doContinue(){
  const pd=S.turn.pending, p=P();
  S.phase='anim';
  switch(pd.type){
    case 'extra':
      await cardToScrap(S.turn.act); S.card=null; await flipDownAll();
      S.turn=freshTurn(); S.turnNo++;
      if(onTable()<=3) return finish();
      S.phase='flip'; return;
    case 'jelly': {
      const s=S.slots[pd.slot], from=centerOf(cardFace()); cardHidden=true; render();
      const dot=chipTarget();
      await fly(from,{...dot,s:dot.s*1.3},{t:'jelly',up:true,dur:650}); sfx('thud');
      p.bank.push('jelly'); away.delete(s.id); S.slots[pd.slot]=null; forget(pd.slot); S.card=null; cardHidden=false; bump(S.cur); render();
      await flipDownAll();
      return endTurn(TT('sumStung',{name:p.name}));
    }
    case 'shark': {
      await cardToScrap(pd.slot); S.card=null; await flipDownAll();
      const lost=await sharkReturn();
      if(S.final) return endTurn(TT('sumSharkLast',{name:p.name}));
      await swirl();
      return endTurn(TT(lost?'sumShark':'sumSharkEmpty',{name:p.name,tokens:plural(lost,'token')}));
    }
    case 'whirl':
      await cardToScrap(S.turn.act); S.card=null; await flipDownAll();
      await swirl('whirl');
      return endTurn(TT('sumWhirl',{name:p.name,banked:bankedNote()}));
    case 'hook': {
      const name=TYPES[S.slots[pd.slot].t].name.toLowerCase();
      await cardToScrap(pd.slot); S.card=null; render(); await flipDownAll();
      return endTurn(TT('sumHook',{name:p.name,banked:bankedNote(),token:name}));
    }
    case 'look':
      S.card=null; render(); await flipDownAll();
      return endTurn(TT('sumSub',{name:p.name,banked:bankedNote()}));
  }
}

function endTurn(summary){
  resetDol();
  S.slots.forEach(s=>{if(s) s.up=false}); S.turn=freshTurn(); S.card=null; away.clear();
  if(S.final||onTable()<=3){ S.endNote=S.endNote||summary; return finish() }
  S.cur=(S.cur+1)%S.players.length; S.summary=summary; S.turnNo++;
  const humans=S.players.filter(p=>!isAI(p)).length;
  S.phase=(!S.net&&!isAI(P())&&humans>1)?'handoff':'flip';
  render();
}
function finish(){ cloudDrop(S.saveCode); S.screen='over'; try{ SOC.recordGame() }catch(e){ console.warn('stats',e) } S.phase=null; render(); sfx('fanfare'); if(S.net&&S.net.host){NET.g.st='over';publishG();lobbyAnnounce()} }

// ---------- home page: Play and Guide tabs, and narrators on each section ----------
const HOME={tab:'play'};
const HOME_SLOTS=[['header','Top: logo and share button'],['install','Get-the-app tip'],['resume','Game in progress'],['code','Have a game code?'],['players','Players and start'],['lb','Leaderboard'],['tray','Guide: tokens in the bag'],['rules','Guide: how to play']];
// THEME.home[section] = {id, m:{phone layout}, d:{computer layout}}; the computer layout falls back to the phone one
// a picture placed on a home section: H={m:{phone layout}, d:{computer layout}}; the computer layout falls back to the phone one
const pvOf=(H,lay,k,def)=>{ const a=H&&H[lay]&&H[lay][k]; if(a!=null) return a; const b=lay==='d'&&H&&H.m?H.m[k]:null; return b!=null?b:def };
const hv=(slot,lay,k,def)=>pvOf((THEME.home||{})[slot]||{},lay,k,def);
function placedHTML(H,src,base,cls){
  const vars=['m','d'].map(l=>{ const sz=pvOf(H,l,'size',1)*base, side=pvOf(H,l,'side','right'), edge=`calc(-14px * ${sz})`;
    return `--h${l}-s:${sz};--h${l}-x:${pvOf(H,l,'dx',0)}px;--h${l}-y:${pvOf(H,l,'dy',0)}px;--h${l}-r:${pvOf(H,l,'rot',0)}deg;--h${l}-f:${pvOf(H,l,'flip',false)?-1:1};--h${l}-L:${side==='left'?edge:'auto'};--h${l}-R:${side==='left'?'auto':edge}` }).join(';');
  return `<img class="${cls}" src="${src}" alt="" aria-hidden="true" style="${vars}">`;
}
// THEME.homeArt[id] = {asset, name, slot (which section), layer ('front' or 'back'), m, d}

// ---------- leaderboards: today, this week, all-time ----------
// Scores live in jf/leaderboard/<board key>: "d-<date>" for a day, "<Monday's date>" for a week, "all" for all-time.
// Days and weeks run on Mountain Time (America/Denver), so the daily board starts fresh at midnight there
// and the weekly one at midnight going into Monday. A score is only written to the boards it makes.
const LB_TZ='America/Denver', LB_TABS=['day','week','all'];
const LB={tab:'week',keys:{},raw:{day:{},week:{},all:{}},loaded:{},off:{},err:{}};
function mtDate(t=Date.now()){ const p=new Intl.DateTimeFormat('en-CA',{timeZone:LB_TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(t)), g=k=>+p.find(x=>x.type===k).value; return new Date(Date.UTC(g('year'),g('month')-1,g('day'))) }
function weekKey(t=Date.now()){ const d=mtDate(t); d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7); return d.toISOString().slice(0,10) }
const dayKey=(t=Date.now())=>'d-'+mtDate(t).toISOString().slice(0,10);
const lbKeyFor=b=>b==='day'?dayKey():b==='week'?weekKey():'all';
const lbAvailable=()=>!!FIREBASE_CONFIG&&!(window.claude&&window.claude.use);
const lbReady=()=>LB_TABS.every(b=>LB.loaded[b]);
// a week's board also counts today's scores, and all-time counts both (same id = same score, kept once)
function lbList(b){
  const m={}, from=b==='day'?['day']:b==='week'?['day','week']:LB_TABS;
  from.forEach(k=>Object.entries(LB.raw[k]||{}).forEach(([id,e])=>{ if(e&&typeof e.score==='number') m[id]={...e,id} }));
  return Object.values(m).sort((x,y)=>y.score-x.score||x.ts-y.ts).slice(0,5);
}
function lbRefresh(){
  if(S&&S.screen==='setup') renderLbCard(); else if(S&&S.screen==='over'&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.lbnew'))) render();
}
async function lbWatch(){
  if(!lbAvailable()) return;
  let core=null;
  for(const b of LB_TABS){
    const key=lbKeyFor(b); if(LB.keys[b]===key) continue;
    LB.keys[b]=key; LB.loaded[b]=false; LB.raw[b]={}; if(LB.off[b]){ try{ LB.off[b]() }catch(e){} LB.off[b]=null }
    // if the board can't be read (offline, or the database rules don't allow it), say so and try again on the next check
    const fail=e=>{ console.warn('leaderboard',e); if(LB.keys[b]!==key) return; LB.err[b]=(e&&e.code)||'error'; LB.keys[b]=null; LB.off[b]=null; lbRefresh() };
    try{ core=core||await cloudCore(); const {D,db}=core;
      LB.off[b]=D.onValue(D.ref(db,'jf/leaderboard/'+key),snap=>{ if(LB.keys[b]!==key) return; LB.raw[b]=snap.val()||{}; LB.loaded[b]=true; LB.err[b]=null; lbRefresh() },fail);
    }catch(e){ fail(e) }
  }
}
const lbMakes=(b,sc)=>{ const l=lbList(b); return l.length<5||sc>l[4].score };
const lbQualifies=sc=>lbReady()&&sc>0&&lbMakes('day',sc);
// the biggest board a score makes: all-time beats this week beats today
const lbBest=sc=>['all','week','day'].find(b=>lbMakes(b,sc))||'day';
const lbBoardWords=b=>T(b==='all'?'lbOfAll':b==='week'?'lbOfWeek':'lbOfDay');

// Home: leave the game for the menu. It stays saved on this device and is copied online under a short code,
// so it can be picked up here or on any other device.
const SAVE_ABC='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const CLOUD={status:'',note:'',checked:{}};
const newSaveCode=()=>Array.from({length:6},()=>SAVE_ABC[Math.floor(Math.random()*SAVE_ABC.length)]).join('');
const fmtCode=c=>c?c.slice(0,3)+'-'+c.slice(3):'';
function goHome(){

  clearTimeout(aiTimer); aiTimer=null; handOpen=null; S.rulesOpen=false; S.quitArm=false;
  const g=S; g.saveCode=g.saveCode||newSaveCode(); g.savedAt=Date.now();
  try{ localStorage.setItem(KEY,JSON.stringify(g)) }catch(e){}
  S=setupState(g.setup); boardEl=null; sfx('tap'); render(); window.scrollTo(0,0);
  cloudSave(g);
}
async function cloudCore(){
  const c=await fbCore(), auth=c.AU.getAuth(c.app);
  if(!auth.currentUser) await c.AU.signInAnonymously(auth);
  return c;
}
async function cloudSave(g){
  if(!FIREBASE_CONFIG||!g||g.net||g.screen!=='play') return;
  g.saveCode=g.saveCode||newSaveCode(); g.savedAt=g.savedAt||Date.now();
  CLOUD.status='saving'; if(S&&S.screen==='setup') render();
  try{ const {D,db}=await cloudCore(); await D.set(D.ref(db,'jf/saves/'+g.saveCode),{s:JSON.stringify(g),t:D.serverTimestamp()}); CLOUD.status='saved' }
  catch(e){ console.warn('cloud save',e); CLOUD.status='error' }
  if(S&&S.screen==='setup') render();
}
async function cloudGet(code){
  const {D,db}=await cloudCore(), v=(await D.get(D.ref(db,'jf/saves/'+code))).val();
  if(!v||typeof v.s!=='string') return null;
  const g=JSON.parse(v.s);
  return g&&g.screen==='play'&&Array.isArray(g.players)&&Array.isArray(g.slots)?g:null;
}
function cloudDrop(code){ if(!code||!FIREBASE_CONFIG) return; cloudCore().then(({D,db})=>D.remove(D.ref(db,'jf/saves/'+code))).catch(()=>{}) }
// open a saved game by its code (typed in, or from a shared link)
async function openSavedGame(raw){
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length===4) return joinByCode(code);
  if(code.length!==6){ CLOUD.note='Game codes are 4 letters (a new online game) or 6 letters and numbers (a saved game).'; return render() }
  CLOUD.note='Looking for game '+fmtCode(code)+'…'; render();
  try{
    const g=await cloudGet(code);
    if(!g){ CLOUD.note='No saved game has the code '+fmtCode(code)+'. It may have finished already.'; return render() }
    g.saveCode=code; try{ localStorage.setItem(KEY,JSON.stringify(g)) }catch(e){}
    CLOUD.note='Game '+fmtCode(code)+' is ready. Tap Resume game to keep playing.'; CLOUD.status='saved'; CLOUD.checked[code]=true;
  }catch(e){ console.warn('cloud load',e); CLOUD.note='Couldn’t reach the saved games right now. Check the connection and try again.' }
  render();
}
// join a live online game by its 4-letter code: go straight to its waiting room and take the first open seat
async function joinByCode(code){
  code=code.toLowerCase();
  CLOUD.note='Joining game '+code.toUpperCase()+'…'; render();
  for(let k=0;k<40&&!NET.lobby;k++) await new Promise(r=>setTimeout(r,250));
  if(!NET.lobby){ CLOUD.note='Online play isn’t connected right now. Check the connection and try again.'; return render() }
  CLOUD.note=''; NET.autoSit=true; NET.joinedAt=Date.now(); guestJoin(code);
}
// a game left on this device may have been played further on another one: use whichever copy is newer
async function cloudFreshen(local){
  const code=local&&local.saveCode; if(!code||CLOUD.checked[code]||!FIREBASE_CONFIG) return; CLOUD.checked[code]=true;
  try{ const g=await cloudGet(code); if(g&&(g.savedAt||0)>(local.savedAt||0)){ g.saveCode=code; localStorage.setItem(KEY,JSON.stringify(g)); CLOUD.note='Updated with the latest moves from another device.'; if(S.screen==='setup') render() } }catch(e){}
}

function render(){
  if(themeDirty&&!busy){ themeDirty=false; boardEl=null }

// You can look at your own hand: on your turn when passing one device around, any time on your own device.

    if(['anim','peeking'].includes(S.phase)) S.phase='flip';

// small screens: a token doubles in size while it flips over, then settles back
const swellOK=()=>matchMedia('(max-width:700px), (max-height:500px)').matches&&!NET.ff;
function swell(el,sp,D){
  const W=boardEl.clientWidth, H=W*S.h, r=D*W, cx=sp.x*W, cy=sp.y*W;  // after doubling, the radius is the token's full width
  const sx=Math.max(r-cx,Math.min(0,W-r-cx)), sy=Math.max(r-cy,Math.min(0,H-r-cy));
  el.style.setProperty('--sx',Math.round(sx)+'px'); el.style.setProperty('--sy',Math.round(sy)+'px');
  el.classList.remove('swell'); void el.offsetWidth; el.classList.add('swell');
  el.addEventListener('animationend',()=>el.classList.remove('swell'),{once:true});
}
function renderBoard(){
  const pickable=!busy&&!NET.pending&&mine(S.cur)&&(['flip','peek','hook','goggles'].includes(S.phase)||goAgainCard());
  if(S.net&&!S.net.host&&!NET.pending) boardEl.querySelectorAll('.tok.aim').forEach(e=>e.classList.remove('aim'));
  boardEl.classList.toggle('dim',pickable&&S.phase!=='flip'&&!goAgainCard());
  const D=S.layout.D, live=new Set();
  S.slots.forEach((s,i)=>{
    if(!s) return;
    live.add(s.id);
    let el=tokMap.get(s.id);
    if(!el){
      el=document.createElement('button'); el.className='tok'+(s.up?' up':'');
      el.innerHTML=`<span class="tilt"><span class="inner"><span class="back"></span><span class="front">${face(s.t)}</span></span></span>`;
      boardEl.appendChild(el); tokMap.set(s.id,el);
    }
    const sp=S.layout.spots[i];
    el.dataset.i=i;
    el.style.left=`${(sp.x-D/2)*100}%`; el.style.top=`${(sp.y-D/2)/S.h*100}%`; el.style.width=`${D*100}%`;
    el.style.setProperty('--r',sp.r+'deg');
    if(s.up&&!el.classList.contains('up')&&swellOK()) swell(el,sp,D);
    el.classList.toggle('up',s.up);
    el.classList.toggle('rev',s.up&&S.turn.rev.includes(i));
    el.classList.toggle('away',away.has(s.id));
    const canPick=!s.up&&pickable&&!(S.phase==='peek'&&(S.turn.peeked||[]).includes(i));
    el.classList.toggle('pick',canPick);
    el.disabled=!canPick;
    el.setAttribute('aria-label',s.up?TYPES[s.t].name:'Face-down token');
  });
  for(const [id,el] of tokMap) if(!live.has(id)){el.remove();tokMap.delete(id)}
  boardEl.querySelectorAll('.hide-spot').forEach(g=>g.remove());
  if(S.phase==='dolphin'&&mine(S.cur)&&DOL.confirmed&&!busy&&!NET.pending){
    const items=['dolphin',...DOL.picks.map(k=>S.scrap[k])];
    for(const i of dolSpots()){
      const sp=S.layout.spots[i], g=document.createElement('button'), at=DOL.spots.indexOf(i);
      g.className='hide-spot'+(at>=0?' taken':''); g.setAttribute('aria-label',at>=0?'Spot chosen; tap to undo':'Hiding spot');
      g.style.left=`${(sp.x-D/2)*100}%`; g.style.top=`${(sp.y-D/2)/S.h*100}%`; g.style.width=`${D*100}%`;
      if(at>=0) g.innerHTML=face(items[at]);
      g.onclick=()=>{
        if(DOL.done) return;
        if(at>=0){ DOL.spots.splice(at,1); return render() }
        DOL.spots.push(i); sfx('tap');
        if(DOL.spots.length<items.length) return render();
        // show the finished hiding spots for a moment before the tokens dive in
        DOL.done=true; render();
        const move='D'+DOL.spots[0]+DOL.picks.map((k,j)=>'d'+k+'s'+DOL.spots[j+1]).join('');
        setTimeout(()=>{ resetDol(); act(move) },1300);
      };
      boardEl.appendChild(g);
    }
  }
}

function bubbleBurst(btn){
  const r=btn.getBoundingClientRect(), layer=document.createElement('div'); layer.className='popfx';
  btn.style.visibility='hidden';
  // the button gives a happy squish, swells fast and pops...
  const ghost=btn.cloneNode(true); ghost.removeAttribute('id'); ghost.classList.add('ghost');
  ghost.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;visibility:visible;transform-origin:50% 50%`;
  let html='';
  // ...into a cloud of bubbles that balloon out, race upward and fade
  const cx=r.left+r.width/2, cy=r.top+r.height/2, px=v=>v.toFixed(1)+'px';
  for(let k=0;k<36;k++){
    const sz=12+Math.random()*34, a=Math.random()*Math.PI*2, x=cx+Math.cos(a)*r.width*.42*Math.random(), y=cy+Math.sin(a)*r.height*.4*Math.random();
    html+=`<i class="bub" style="left:${px(x-sz/2)};top:${px(y-sz/2)};width:${px(sz)};height:${px(sz)};--dx:${px(Math.cos(a)*(40+Math.random()*90))};--rise:${px(260+Math.random()*Math.min(innerHeight*.7,560))};--w:${px(8+Math.random()*16)};--d:${Math.round(1100+Math.random()*700)}ms;--dl:${Math.round(30+Math.random()*110)}ms"><s><b></b></s></i>`;
  }
  // and rings ripple out from where Play was
  for(let k=0;k<3;k++) html+=`<i class="ring" style="left:${px(cx-60)};top:${px(cy-60)};width:120px;height:120px;--s:${7+k*2};--dl:${90+k*160}ms"></i>`;
  layer.innerHTML=html; layer.prepend(ghost); document.body.appendChild(layer);
  setTimeout(()=>layer.remove(),2400);
}

    const mineName=[prof.display_name,myName()].filter(Boolean).map(n=>n.toLowerCase());
    let me=S.net?(S.net.host?(ppl[0]||[])[1]:S.net.seat):(ppl.find(([p])=>mineName.includes(String(p.name).toLowerCase()))||(ppl.length===1?ppl[0]:[]))[1];
    if(me==null||!S.players[me]) return; S.statsDone=true;
    const sc=S.players.map(p=>finalScore(p)), js=S.players.map(jellyCount), top=Math.max(...sc), tj=Math.min(...S.players.map((p,i)=>sc[i]===top?js[i]:99));
    const st={...(prof.stats||{})}, mine=sc[me];
    st.games=(st.games||0)+1; if(mine===top&&js[me]===tj) st.wins=(st.wins||0)+1;
    st.best=Math.max(st.best||0,mine); st.points=(st.points||0)+mine; st.schools=(st.schools||0)+fishPairs(S.players[me]); st.last=Date.now();
    saveProfile({stats:st});
  }

  // ---------- friends ----------
  async function loadFriends(){
    if(!user) return;
    try{
      const {data,error}=await sb.from('friends').select('id,user_id,friend_user_id,status,friend_name').or(`user_id.eq.${user.id},friend_user_id.eq.${user.id}`); if(error) throw error;
      const seen=new Set(); rows=(data||[]).filter(r=>r&&!seen.has(r.id)&&seen.add(r.id));
      const ids=[...new Set(rows.map(other))];
      const need=ids.filter(id=>!people.has(id));
      if(need.length){ const {data:ps}=await sb.from('users_public').select('id,username,display_name').in('id',need); (ps||[]).forEach(p=>people.set(p.id,p)) }
      if(ids.length){ const {data:fp}=await sb.from('gm_app_profiles').select('user_id,display_name,avatar,stats').eq('app',GM.app).in('user_id',ids); (fp||[]).forEach(p=>fprofs.set(p.user_id,p)) }
      const acc=rows.filter(r=>r.status==='accepted').map(other);
      if(acc.length){ const {data:s}=await sb.from('user_statuses').select('user_id,status,last_activity_at').in('user_id',acc); bt.clear(); (s||[]).forEach(x=>bt.set(x.user_id,x)) }
    }catch(e){ console.warn('friends',e) }
    draw(); badge(); if(LB.tab==='friends') renderLbCard();
  }
  function lists(){
    const by=f=>{ const m=new Map(); rows.filter(f).forEach(r=>{ const id=other(r); if(!m.has(id)) m.set(id,r) }); return [...m.entries()].map(([id,r])=>({id,r})) };
    const blocked=new Set(rows.filter(r=>r.status==='blocked').map(other));
    const friends=by(r=>r.status==='accepted').filter(x=>!blocked.has(x.id)); friends.forEach(x=>x.s=statusOf(x.id));
    friends.sort((a,b)=>b.s.rank-a.s.rank||nameOf(a.id).localeCompare(nameOf(b.id)));
    return {friends,incoming:by(r=>r.status==='pending'&&r.friend_user_id===user.id).filter(x=>!blocked.has(x.id)),outgoing:by(r=>r.status==='pending'&&r.user_id===user.id)};
  }
  const relation=id=>{ const rs=rows.filter(r=>other(r)===id); if(rs.some(r=>r.status==='blocked')) return 'blocked'; if(rs.some(r=>r.status==='accepted')) return 'friend';
    if(rs.some(r=>r.status==='pending'&&r.friend_user_id===user.id)) return 'incoming'; if(rs.some(r=>r.status==='pending')) return 'outgoing'; return '' };
  const isFriend=id=>relation(id)==='friend';
  const request=id=>guard(async()=>{
    const rel=relation(id); if(rel==='friend'||rel==='outgoing'||rel==='blocked') return;
    if(rel==='incoming'){ const r=rows.find(x=>x.user_id===id&&x.friend_user_id===user.id&&x.status==='pending'); if(r){ await acceptRow(r.id); return } }
    const {error}=await sb.from('friends').insert({user_id:user.id,friend_user_id:id,status:'pending',friend_name:nameOf(id),friend_email:''});
    if(error&&!/duplicate|unique/i.test(error.message||'')) throw error;
    msg=`Friend request sent to ${nameOf(id)}.`; await loadFriends() });
  async function acceptRow(rowId){ const {error}=await sb.from('friends').update({status:'accepted'}).eq('id',rowId); if(error) throw error; await loadFriends() }
  const accept=rowId=>guard(()=>acceptRow(rowId));
  // decline, cancel and unfriend all remove every row between the two of you (same as BoomTown and Food Fight)
  const drop=id=>guard(async()=>{ const {error}=await sb.from('friends').delete().or(`and(user_id.eq.${user.id},friend_user_id.eq.${id}),and(user_id.eq.${id},friend_user_id.eq.${user.id})`); if(error) throw error; await loadFriends() });
  async function search(q){
    searchQ=q; q=String(q||'').replace(/[^\p{L}\p{N} _.\-]/gu,'').trim().slice(0,24);
    if(q.length<2){ searchRes=null; draw(); return }
    try{ const {data}=await sb.from('users_public').select('id,username,display_name').or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).limit(12);
      if(searchQ.replace(/[^\p{L}\p{N} _.\-]/gu,'').trim().slice(0,24)!==q) return;
      searchRes=(data||[]).filter(p=>p.id!==user.id); searchRes.forEach(p=>{ if(!people.has(p.id)) people.set(p.id,p) });
      const need=searchRes.map(p=>p.id).filter(id=>!fprofs.has(id));
      if(need.length){ const {data:fp}=await sb.from('gm_app_profiles').select('user_id,display_name,avatar,stats').eq('app',GM.app).in('user_id',need); (fp||[]).forEach(p=>fprofs.set(p.user_id,p)) }
